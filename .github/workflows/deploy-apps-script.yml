name: Deploy Apps Script

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'personal-assistant/google-apps-script/**'
      - 'scripts/validate-gas-folders.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-apps-script.yml'

jobs:
  push:
    name: clasp push
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Apps Script folders
        run: npm run validate:gas

      - name: Configure clasp auth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Missing CLASPRC_JSON repository secret."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push Apps Script projects
        shell: bash
        run: |
          set -euo pipefail

          folders=(
            "personal-assistant/google-apps-script/hub"
            "personal-assistant/google-apps-script/registry"
            "personal-assistant/google-apps-script/automation"
            "personal-assistant/google-apps-script/dashboard"
          )

          for folder in "${folders[@]}"; do
            script_id="$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(c.scriptId || '')" "$folder/.clasp.json")"

            if [[ "$script_id" == REPLACE_WITH_* ]]; then
              echo "::warning file=$folder/.clasp.json::Skipping $folder because scriptId is still a placeholder."
              continue
            fi

            echo "Pushing $folder"
            (cd "$folder" && npx clasp push --force)
          done

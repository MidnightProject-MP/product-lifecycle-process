<!doctype html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #202124;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #fff;
    }

    body.wide {
      padding: 18px 20px;
    }

    label {
      display: block;
      margin: 12px 0 4px;
      color: #3c4043;
      font-weight: 700;
    }

    select,
    input,
    .html-editor {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 8px;
      font: inherit;
      color: #202124;
      background: #fff;
    }

    .html-editor {
      line-height: 1.4;
      min-height: 190px;
      outline: none;
      overflow: auto;
      resize: vertical;
    }

    .editor-toolbar {
      align-items: center;
      background: #f8fafd;
      border: 1px solid #dadce0;
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 5px;
    }

    .editor-toolbar button {
      background: transparent;
      border-radius: 4px;
      color: #3c4043;
      min-width: 30px;
      padding: 5px 7px;
    }

    .editor-toolbar button:hover,
    .editor-toolbar button:focus {
      background: #e8f0fe;
      outline: none;
    }

    .editor-toolbar .separator {
      background: #dadce0;
      height: 22px;
      margin: 0 2px;
      width: 1px;
    }

    .html-editor.with-toolbar {
      border-radius: 0 0 6px 6px;
    }

    .title-editor {
      min-height: 34px;
      resize: none;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: .62;
    }

    .mode-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
    }

    .mode-toggle {
      font-size: 12px;
      padding: 7px 9px;
    }

    .primary {
      background: #1a73e8;
      color: #fff;
    }

    .secondary {
      background: #e8f0fe;
      color: #174ea6;
    }

    .plain {
      background: #f1f3f4;
      color: #202124;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    body.wide .html-editor {
      min-height: 360px;
    }

    body.wide .title-editor {
      min-height: 34px;
    }

    .meta {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
      margin-top: 12px;
    }

    .console-panel {
      background: #f8fafd;
      border: 1px solid #dfe5f2;
      border-radius: 8px;
      margin: 8px 0 14px;
      padding: 10px;
    }

    .console-panel h2 {
      color: #202124;
      font-size: 14px;
      line-height: 1.25;
      margin: 0 0 8px;
    }

    .console-eyebrow {
      color: #5f6368;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .panel-summary {
      color: #3c4043;
      font-size: 12px;
      line-height: 1.4;
      margin: -2px 0 10px;
    }

    .panel-alert {
      background: #fce8e6;
      border: 1px solid #fad2cf;
      border-radius: 6px;
      color: #a50e0e;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
      margin: 8px 0 10px;
      padding: 8px;
    }

    .context-grid {
      display: grid;
      gap: 8px;
    }

    body.wide .context-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .context-item {
      min-width: 0;
    }

    .context-label {
      color: #5f6368;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .context-value {
      color: #202124;
      line-height: 1.35;
      margin-top: 2px;
      overflow-wrap: anywhere;
    }

    .context-muted {
      color: #5f6368;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 999px;
      color: #3c4043;
      display: inline-block;
      font-size: 12px;
      line-height: 1.2;
      padding: 4px 8px;
    }

    .route-grid {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    body.wide .route-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .route-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 8px;
    }

    .route-title {
      color: #3c4043;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .route-state {
      color: #202124;
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .route-meta {
      color: #5f6368;
      font-size: 11px;
      line-height: 1.35;
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    .guidance {
      border-left: 3px solid #1a73e8;
      color: #3c4043;
      font-size: 12px;
      line-height: 1.4;
      margin-top: 12px;
      padding-left: 9px;
    }

    .guidance ul {
      margin: 6px 0 0 18px;
      padding: 0;
    }

    .guidance li {
      margin: 3px 0;
    }

    details.console-details {
      margin-top: 8px;
    }

    details.console-details summary {
      color: #5f6368;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .details-grid {
      display: grid;
      gap: 5px;
      margin-top: 8px;
    }

    .meta div {
      margin: 0 0 6px;
    }

    .meta div:last-child {
      margin-bottom: 0;
    }

    .key {
      color: #5f6368;
      font-weight: 700;
    }

    .editor-note {
      color: #5f6368;
      font-size: 12px;
      line-height: 1.35;
      margin-top: 4px;
    }

    .link-row {
      display: none;
      margin-top: 10px;
    }

    .link-row a + a {
      margin-left: 12px;
    }

    .status {
      margin: 10px 0;
      min-height: 18px;
      color: #5f6368;
    }

    .error {
      color: #a50e0e;
      font-weight: 700;
    }

    .success {
      color: #137333;
      font-weight: 700;
    }

    a {
      color: #1a73e8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="mode-bar">
    <button class="plain mode-toggle" id="modeToggle" onclick="toggleWorkspaceMode()" hidden>Expand Workspace</button>
  </div>
  <div id="status" class="status">Loading communication console...</div>
  <div id="app" hidden>
    <div id="contextPanel" class="console-panel"></div>

    <label for="communicationSelect">Communication</label>
    <select id="communicationSelect"></select>

    <label for="flowAction">Action</label>
    <select id="flowAction"></select>

    <label for="messageTitle">Title</label>
    <div class="editor-toolbar" aria-label="Title formatting tools">
      <button type="button" title="Bold" onmousedown="formatEditor(event, 'messageTitle', 'bold')"><strong>B</strong></button>
      <button type="button" title="Italic" onmousedown="formatEditor(event, 'messageTitle', 'italic')"><em>I</em></button>
      <span class="separator"></span>
      <button type="button" title="Add link" onmousedown="addLink(event, 'messageTitle')">Link</button>
      <button type="button" title="Remove link" onmousedown="formatEditor(event, 'messageTitle', 'unlink')">Unlink</button>
    </div>
    <div id="messageTitle" class="html-editor title-editor with-toolbar" contenteditable="true"></div>

    <label for="messageBody">Body</label>
    <div class="editor-toolbar" aria-label="Body formatting tools">
      <button type="button" title="Bold" onmousedown="formatEditor(event, 'messageBody', 'bold')"><strong>B</strong></button>
      <button type="button" title="Italic" onmousedown="formatEditor(event, 'messageBody', 'italic')"><em>I</em></button>
      <span class="separator"></span>
      <button type="button" title="Bullet list" onmousedown="formatEditor(event, 'messageBody', 'insertUnorderedList')">&bull;</button>
      <button type="button" title="Numbered list" onmousedown="formatEditor(event, 'messageBody', 'insertOrderedList')">1.</button>
      <button type="button" title="Decrease list level" onmousedown="formatEditor(event, 'messageBody', 'outdent')">&larr;</button>
      <button type="button" title="Increase list level" onmousedown="formatEditor(event, 'messageBody', 'indent')">&rarr;</button>
      <span class="separator"></span>
      <button type="button" title="Add link" onmousedown="addLink(event, 'messageBody')">Link</button>
      <button type="button" title="Remove link" onmousedown="formatEditor(event, 'messageBody', 'unlink')">Unlink</button>
    </div>
    <div id="messageBody" class="html-editor with-toolbar" contenteditable="true"></div>
    <div class="editor-note">Use the toolbar for formatting. Tab and Shift+Tab adjust list levels.</div>

    <div class="link-row">
      <a id="anchor" href="#" target="_blank" hidden>Open Slack anchor</a>
      <a id="testAnchor" href="#" target="_blank" hidden>Open last test</a>
    </div>

    <div class="actions">
      <button class="plain" id="syncBtn" onclick="syncDashboardNow()">Sync Dashboard Now</button>
      <button class="secondary" id="testBtn" onclick="sendTest()">Send Test to Slack</button>
      <button class="secondary" id="queueBtn" onclick="queueDraft()">Queue up Draft</button>
      <button class="primary" id="approveBtn" onclick="approveDraft()">Approve & Send</button>
    </div>
    <div id="actionGuidance" class="guidance"></div>
  </div>

  <script>
    let currentContext = null;
    let actionDefaults = {};
    let consoleMode = 'sidebar';
    let savedEditorRanges = {};

    function setStatus(message, mode) {
      const el = document.getElementById('status');
      el.textContent = message || '';
      el.className = 'status ' + (mode || '');
    }

    function setBusy(isBusy) {
      ['communicationSelect', 'flowAction', 'messageTitle', 'messageBody', 'syncBtn', 'testBtn', 'queueBtn', 'approveBtn', 'modeToggle'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        if (id === 'messageTitle' || id === 'messageBody') {
          el.contentEditable = isBusy ? 'false' : 'true';
        } else {
          el.disabled = isBusy;
        }
      });
      Array.from(document.querySelectorAll('.editor-toolbar button')).forEach(button => {
        button.disabled = isBusy;
      });
    }

    function applyConsoleMode(mode) {
      consoleMode = mode === 'wide' ? 'wide' : 'sidebar';
      document.body.classList.toggle('wide', consoleMode === 'wide');
      const toggle = document.getElementById('modeToggle');
      toggle.textContent = consoleMode === 'wide' ? 'Minimize to Sidebar' : 'Expand Workspace';
      toggle.hidden = false;
    }

    function loadInitial() {
      google.script.run
        .withSuccessHandler(result => {
          const state = result && result.launchState || {};
          applyConsoleMode(state.mode);
          render(result && result.context, state.hasForm ? state.form : null);
        })
        .withFailureHandler(error => {
          applyConsoleMode('sidebar');
          showFailure(error);
          load();
        })
        .getReviewControllerInitialContext();
    }

    function load(selection, formOverride) {
      setBusy(true);
      setStatus('Loading communication console...');
      google.script.run
        .withSuccessHandler(context => render(context, formOverride || null))
        .withFailureHandler(showFailure)
        .getReviewControllerContext(selection || '');
    }

    function render(context, formOverride) {
      setBusy(false);
      currentContext = context;
      const app = document.getElementById('app');
      if (!context || !context.ok) {
        app.hidden = true;
        setStatus(context && context.message ? context.message : 'Unable to load Communication Console.', 'error');
        return;
      }

      app.hidden = false;
      setStatus(context.message || 'Ready.', 'success');

      const communicationSelect = document.getElementById('communicationSelect');
      communicationSelect.textContent = '';
      (context.communications || []).forEach(optionData => {
        const option = document.createElement('option');
        option.value = optionData.value;
        option.textContent = optionData.label;
        communicationSelect.appendChild(option);
      });
      communicationSelect.value = context.selectedCommunication || 'new';
      communicationSelect.onchange = function() {
        load(communicationSelect.value);
      };

      document.getElementById('messageTitle').innerHTML = context.queue.messageTitleHtml || escapeHtml(context.queue.messageTitle || context.queue.subject || '');
      document.getElementById('messageBody').innerHTML = context.queue.messageBodyHtml || '';

      const anchor = document.getElementById('anchor');
      if (context.flow.anchorUrl) {
        anchor.href = context.flow.anchorUrl;
        anchor.hidden = false;
      } else {
        anchor.hidden = true;
      }

      const testAnchor = document.getElementById('testAnchor');
      const testAnchorUrl = context.queue.testSlackUrl || context.flow.testAnchorUrl || '';
      if (testAnchorUrl) {
        testAnchor.href = testAnchorUrl;
        testAnchor.hidden = false;
      } else {
        testAnchor.hidden = true;
      }

      const actionSelect = document.getElementById('flowAction');
      actionSelect.textContent = '';
      actionDefaults = {};
      context.actions.forEach(action => {
        const option = document.createElement('option');
        option.value = action.value;
        option.textContent = action.label;
        option.dataset.eventKey = action.eventKey || '';
        actionSelect.appendChild(option);
        actionDefaults[action.value] = action.defaults || {};
      });
      actionSelect.onchange = function() {
        applyActionDefaults();
        renderContextPanel(currentContext);
        renderActionGuidance(currentContext);
      };
      if (formOverride) {
        applyFormOverride(formOverride);
      } else if ((context.mode === 'new' || context.mode === 'flow') && actionSelect.options.length) {
        applyActionDefaults();
      }
      renderContextPanel(context);
      renderActionGuidance(context);
      bindEditorEvents();
    }

    function renderContextPanel(context) {
      const panel = document.getElementById('contextPanel');
      const queue = context.queue || {};
      const flow = context.flow || {};
      const selection = context.selection || {};
      const modeLabel = context.mode === 'new' ? 'New communication' :
        context.mode === 'flow' ? 'Existing communication' :
        'Queued draft';
      const subject = queue.subject || flow.subject || 'No subject yet';
      const eventName = (context.mode === 'new' || context.mode === 'flow') ?
        getSelectedActionLabel() || queue.eventName || flow.currentState || 'Choose an action' :
        queue.eventName || getSelectedActionLabel() || flow.currentState || 'Choose an action';
      const owner = queue.owner || 'Owner not set';
      const status = queue.status || flow.status || '';
      const current = flow.exists ? flow.currentState : 'No parent thread yet';
      const next = flow.exists ? flow.expectedNext : 'Choose an action to start the communication.';
      const detours = flow.exists ? flow.availableDetours || 'No detours configured' : '';
      const source = friendlySourceName(queue.source || selection.sourceSheet || 'Communication Console');
      const liveUrl = queue.slackUrl || flow.anchorUrl || '';
      const testUrl = queue.testSlackUrl || flow.testAnchorUrl || '';

      const rows = [
        contextItemHtml('Owner', owner),
        contextItemHtml('Workflow status', status || modeLabel),
        contextItemHtml('Selected action', eventName),
        contextItemHtml('Current state', current),
        contextItemHtml('Expected next', next)
      ];
      if (detours) rows.push(contextItemHtml('Available detours', detours));
      if (queue.scheduledFor) rows.push(contextItemHtml('Scheduled for', formatDateTime(queue.scheduledFor)));
      rows.push(contextItemHtml('Source', source));

      const chips = [];
      chips.push(chipHtml(modeLabel));
      if (queue.lane) chips.push(chipHtml(queue.lane));
      if (queue.sendRule) chips.push(chipHtml(queue.sendRule));
      if (queue.error) chips.push(chipHtml('Needs attention'));

      panel.innerHTML =
        '<div class="console-eyebrow">' + escapeHtml(modeLabel) + '</div>' +
        '<h2>' + escapeHtml(subject) + '</h2>' +
        '<div class="panel-summary">' + escapeHtml(contextSummaryText(context, eventName)) + '</div>' +
        (queue.error ? '<div class="panel-alert">' + escapeHtml(queue.error) + '</div>' : '') +
        '<div class="context-grid">' + rows.join('') + '</div>' +
        (chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '') +
        '<div class="route-grid">' +
          routeCardHtml('Test Slack', testUrl ? 'Last test is available' : 'No test sent yet', testUrl, testRouteMeta(queue, flow)) +
          routeCardHtml('Live Slack', liveUrl ? 'Live anchor is available' : 'Not sent live yet', liveUrl, liveRouteMeta(queue, flow)) +
        '</div>' +
        buildTechnicalDetailsHtml(context);
    }

    function contextSummaryText(context, eventName) {
      if (!context || context.mode === 'new') {
        return 'Start a new parent communication. Choose a type and action, then edit the final title and body.';
      }
      if (context.mode === 'flow') {
        return 'Continue an existing parent communication with the chosen expected path or detour.';
      }
      const queue = context.queue || {};
      if (queue.status === 'Scheduled') {
        return 'This draft was queued by an automation or flow step and is waiting for review.';
      }
      if (queue.status === 'Error') {
        return 'This draft needs attention before it can be sent.';
      }
      return 'Review the queued ' + (eventName || 'communication') + ' draft, send a test if needed, then approve the live send.';
    }

    function contextItemHtml(label, value) {
      const safeValue = value ? escapeHtml(value) : '<span class="context-muted">Not set</span>';
      return '<div class="context-item"><div class="context-label">' + escapeHtml(label) + '</div><div class="context-value">' + safeValue + '</div></div>';
    }

    function chipHtml(value) {
      return '<span class="chip">' + escapeHtml(value) + '</span>';
    }

    function linkChipHtml(label, url) {
      return '<a class="chip" href="' + escapeAttribute(url) + '" target="_blank">' + escapeHtml(label) + '</a>';
    }

    function routeCardHtml(label, state, url, meta) {
      const stateHtml = url ?
        '<a href="' + escapeAttribute(url) + '" target="_blank">' + escapeHtml(state) + '</a>' :
        escapeHtml(state);
      return '<div class="route-card">' +
        '<div class="route-title">' + escapeHtml(label) + '</div>' +
        '<div class="route-state">' + stateHtml + '</div>' +
        (meta ? '<div class="route-meta">' + escapeHtml(meta) + '</div>' : '') +
        '</div>';
    }

    function testRouteMeta(queue, flow) {
      const parts = [];
      if (queue.testSentAt) parts.push('Sent ' + formatDateTime(queue.testSentAt));
      if (queue.testSlackChannel || flow.testSlackChannel) parts.push('Channel ' + (queue.testSlackChannel || flow.testSlackChannel));
      if (queue.testSlackMessageTs || flow.testLatestReplyTs) parts.push('TS ' + (queue.testSlackMessageTs || flow.testLatestReplyTs));
      return parts.join(' | ');
    }

    function liveRouteMeta(queue, flow) {
      const parts = [];
      if (flow.lastConfirmedAt) parts.push('Confirmed ' + formatDateTime(flow.lastConfirmedAt));
      if (flow.slackChannel) parts.push('Channel ' + flow.slackChannel);
      if (flow.latestReplyTs || flow.threadTs) parts.push('TS ' + (flow.latestReplyTs || flow.threadTs));
      if (queue.channelOverride) parts.push('Override ' + queue.channelOverride);
      return parts.join(' | ');
    }

    function buildTechnicalDetailsHtml(context) {
      const queue = context.queue || {};
      const flow = context.flow || {};
      const selection = context.selection || {};
      const details = [
        ['Queue ID', queue.queueId || ''],
        ['Flow ID', queue.flowId || flow.flowId || ''],
        ['Event Key', queue.eventKey || ''],
        ['Queue status', queue.status || ''],
        ['Created at', queue.createdAt || ''],
        ['Updated at', queue.updatedAt || flow.updatedAt || ''],
        ['Source sheet', selection.sourceSheet || ''],
        ['Source row', selection.row || selection.queueRow || '']
      ].filter(row => row[1] !== '' && row[1] != null);
      if (!details.length) return '';
      return '<details class="console-details"><summary>Details</summary><div class="details-grid">' +
        details.map(row => contextItemHtml(row[0], String(row[1]))).join('') +
        '</div></details>';
    }

    function renderActionGuidance(context) {
      const guidance = document.getElementById('actionGuidance');
      if (!guidance) return;

      if (!context || !context.ok) {
        guidance.innerHTML = '';
        return;
      }

      const actionLabel = getSelectedActionLabel();
      const bullets = [];
      if (context.mode === 'new') {
        bullets.push('Choose the communication type and action that starts the parent thread.');
        bullets.push('Edit the final Title and Body directly. Templates are only the starting scaffold.');
        bullets.push('Send Test posts to the sandbox channel. Approve & Send posts to the live channel.');
      } else if (context.mode === 'flow') {
        bullets.push('Choose the next expected update or detour for this existing parent communication.');
        bullets.push('Send Test checks the Slack formatting without closing the flow.');
        bullets.push('Approve & Send posts live, updates the parent anchor when policy allows it, and records History.');
      } else {
        bullets.push('This draft is already queued. Editing here updates the saved final message.');
        bullets.push('Send Test posts to the sandbox channel and keeps the draft active for live approval.');
        bullets.push('Approve & Send posts live, advances the flow, and schedules the next expected draft when configured.');
      }

      guidance.innerHTML =
        '<strong>Next action:</strong> ' + escapeHtml(actionLabel || 'Choose an action') +
        '<ul>' + bullets.map(bullet => '<li>' + escapeHtml(bullet) + '</li>').join('') + '</ul>';
    }

    function getSelectedActionLabel() {
      const actionSelect = document.getElementById('flowAction');
      if (!actionSelect || actionSelect.selectedIndex < 0) return '';
      const selected = actionSelect.options[actionSelect.selectedIndex];
      return selected ? selected.textContent || '' : '';
    }

    function friendlySourceName(source) {
      const value = String(source || '').trim();
      if (!value) return 'Communication Console';
      if (value === 'Flow_State') return 'Existing parent communication';
      if (/dashboard/i.test(value)) return 'Dashboard sync';
      if (/console/i.test(value)) return 'Communication Console';
      return value;
    }

    function formatDateTime(value) {
      if (!value) return '';
      const text = String(value);
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
      const parsed = new Date(text);
      if (isNaN(parsed.getTime())) return text;
      return parsed.toLocaleString([], {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    function applyFormOverride(form) {
      if (!form) return;

      const actionSelect = document.getElementById('flowAction');
      if (form.flowAction && Array.from(actionSelect.options).some(option => option.value === form.flowAction)) {
        actionSelect.value = form.flowAction;
      }

      document.getElementById('messageTitle').innerHTML = form.messageTitleHtml || escapeHtml(form.messageTitle || '');
      document.getElementById('messageBody').innerHTML = form.messageBodyHtml || '';
    }

    function applyActionDefaults() {
      const action = document.getElementById('flowAction').value;
      const defaults = actionDefaults[action];
      if (!defaults) return;

      document.getElementById('messageTitle').innerHTML = defaults.messageTitleHtml || escapeHtml(defaults.messageTitle || '');
      document.getElementById('messageBody').innerHTML = defaults.messageBodyHtml || '';
      setStatus(action === 'selected' ? 'Selected draft restored.' : 'Default text loaded for chosen action.', 'success');
    }

    function collectForm() {
      const titleEditor = document.getElementById('messageTitle');
      const title = titleEditor.textContent || '';
      const titleHtml = titleEditor.innerHTML;
      const bodyHtml = document.getElementById('messageBody').innerHTML;
      return {
        selection: document.getElementById('communicationSelect').value,
        queueId: currentContext && currentContext.queue ? currentContext.queue.queueId : '',
        flowId: currentContext && currentContext.queue ? currentContext.queue.flowId : '',
        flowAction: document.getElementById('flowAction').value,
        eventKey: selectedActionEventKey(),
        subject: currentContext && currentContext.queue ? currentContext.queue.subject : title,
        messageTitle: title,
        messageTitleHtml: titleHtml,
        messageBodyHtml: bodyHtml,
        owner: currentContext && currentContext.queue ? currentContext.queue.owner : '',
        priority: currentContext && currentContext.queue ? currentContext.queue.priority : ''
      };
    }

    function selectedActionEventKey() {
      const actionSelect = document.getElementById('flowAction');
      const selected = actionSelect.options[actionSelect.selectedIndex];
      return selected ? selected.dataset.eventKey || '' : '';
    }

    function queueDraft() {
      const form = collectForm();
      const validation = validateForm(form);
      if (!validation.ok) return showValidationFailure(validation, form);
      runAction('Queueing draft...', 'queueReviewControllerDraft', form, render);
    }

    function sendTest() {
      const form = collectForm();
      const validation = validateForm(form);
      if (!validation.ok) return showValidationFailure(validation, form);
      runAction('Sending test to Slack...', 'sendReviewControllerTest', form, render);
    }

    function approveDraft() {
      const form = collectForm();
      const validation = validateForm(form);
      if (!validation.ok) return showValidationFailure(validation, form);
      runAction('Approving and sending...', 'approveReviewControllerSelection', form, afterTerminalAction);
    }

    function syncDashboardNow() {
      const form = currentContext && currentContext.ok ? collectForm() : {};
      setBusy(true);
      setStatus('Syncing dashboard...');
      google.script.run
        .withSuccessHandler(result => afterDashboardSync(result, form))
        .withFailureHandler(showFailure)
        .syncDashboardFromCommunicationConsole(form);
    }

    function validateForm(form) {
      const missing = [];
      if (!form.eventKey) missing.push('action');
      if (!htmlHasVisibleText(form.messageTitleHtml)) missing.push('title');
      if (!htmlHasVisibleText(form.messageBodyHtml)) missing.push('body');
      return {
        ok: missing.length === 0,
        missing: missing
      };
    }

    function htmlHasVisibleText(html) {
      const scratch = document.createElement('div');
      scratch.innerHTML = html || '';
      return Boolean(String(scratch.textContent || '').trim());
    }

    function bindEditorEvents() {
      ['messageTitle', 'messageBody'].forEach(id => {
        const editor = document.getElementById(id);
        editor.onkeyup = () => saveEditorSelection(id);
        editor.onmouseup = () => saveEditorSelection(id);
        editor.onfocus = () => saveEditorSelection(id);
        editor.onkeydown = event => handleEditorKeydown(event, id);
      });
    }

    function saveEditorSelection(editorId) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return;
      const editor = document.getElementById(editorId);
      const range = selection.getRangeAt(0);
      if (editor.contains(range.commonAncestorContainer)) {
        savedEditorRanges[editorId] = range.cloneRange();
      }
    }

    function restoreEditorSelection(editorId) {
      const editor = document.getElementById(editorId);
      editor.focus();
      const savedEditorRange = savedEditorRanges[editorId];
      if (!savedEditorRange) return;
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(savedEditorRange);
    }

    function formatEditor(event, editorId, command) {
      event.preventDefault();
      restoreEditorSelection(editorId);
      document.execCommand(command, false, null);
      saveEditorSelection(editorId);
      document.getElementById(editorId).focus();
    }

    function addLink(event, editorId) {
      event.preventDefault();
      restoreEditorSelection(editorId);
      const url = window.prompt('Link URL');
      if (!url) return;
      document.execCommand('createLink', false, url);
      saveEditorSelection(editorId);
      document.getElementById(editorId).focus();
    }

    function handleEditorKeydown(event, editorId) {
      saveEditorSelection(editorId);
      if (editorId === 'messageTitle' && event.key === 'Enter') {
        event.preventDefault();
        return;
      }
      if (editorId !== 'messageBody') return;
      if (event.key !== 'Tab') return;
      event.preventDefault();
      document.execCommand(event.shiftKey ? 'outdent' : 'indent', false, null);
      saveEditorSelection(editorId);
    }

    function escapeHtml(value) {
      const scratch = document.createElement('div');
      scratch.textContent = value || '';
      return scratch.innerHTML;
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/"/g, '&quot;');
    }

    function showValidationFailure(validation, form) {
      const message = 'Add ' + validation.missing.join(', ') + ' before continuing.';
      setStatus(message, 'error');
      logClientEvent('validation_failure', form, { missing: validation.missing.join(', ') });
    }

    function toggleWorkspaceMode() {
      const targetMode = consoleMode === 'wide' ? 'sidebar' : 'wide';
      const form = currentContext && currentContext.ok ? collectForm() : {};
      setBusy(true);
      setStatus(targetMode === 'wide' ? 'Opening wide workspace...' : 'Returning to sidebar...');

      const runner = google.script.run
        .withSuccessHandler(() => google.script.host.close())
        .withFailureHandler(showFailure);

      if (targetMode === 'wide') {
        runner.expandReviewControllerWorkspace(form);
      } else {
        runner.minimizeReviewControllerWorkspace(form);
      }
    }

    function runAction(message, fnName, form, handler) {
      setBusy(true);
      setStatus(message);
      const runner = google.script.run
        .withSuccessHandler(handler)
        .withFailureHandler(showFailure);

      if (fnName === 'saveReviewControllerDraft') {
        runner.saveReviewControllerDraft(form);
      } else if (fnName === 'queueReviewControllerDraft') {
        runner.queueReviewControllerDraft(form);
      } else if (fnName === 'approveReviewControllerDraft') {
        runner.approveReviewControllerDraft(form);
      } else if (fnName === 'approveReviewControllerSelection') {
        runner.approveReviewControllerSelection(form);
      } else if (fnName === 'sendReviewControllerTest') {
        runner.sendReviewControllerTest(form);
      } else if (fnName === 'createReviewControllerFlowActionDraft') {
        runner.createReviewControllerFlowActionDraft(form);
      }
    }

    function afterTerminalAction(result) {
      setBusy(false);
      setStatus(result && result.message ? result.message : 'Done.', 'success');
      window.setTimeout(load, 700);
    }

    function afterDashboardSync(result, form) {
      setBusy(false);
      setStatus(result && result.message ? result.message : 'Dashboard sync complete.', 'success');
      window.setTimeout(() => load(form && form.selection || '', form || null), 700);
    }

    function showFailure(error) {
      setBusy(false);
      setStatus(error && error.message ? error.message : String(error), 'error');
      logClientEvent('ui_error', currentContext && currentContext.ok ? collectForm() : {}, {
        error: error && error.message ? error.message : String(error)
      });
    }

    function logClientEvent(eventType, form, details) {
      try {
        google.script.run.logReviewControllerClientEvent(eventType, form || {}, details || {});
      } catch (error) {
        // Logging is best-effort and must never block PM workflow.
      }
    }

    loadInitial();
  </script>
</body>
</html>

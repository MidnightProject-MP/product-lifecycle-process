<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --surface: #ffffff;
      --surface-2: #fbfbfa;
      --line: #deded9;
      --line-strong: #c9c9c1;
      --text: #171717;
      --muted: #6b6b63;
      --muted-2: #8a8a82;
      --accent: #635bff;
      --accent-soft: #f0efff;
      --green: #0f7a4f;
      --green-soft: #e9f7ef;
      --amber: #a15c00;
      --amber-soft: #fff4df;
      --red: #b42318;
      --red-soft: #fff0ed;
      --blue: #1769e0;
      --blue-soft: #edf4ff;
      --shadow: 0 18px 50px rgba(23, 23, 23, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      color: var(--text);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      margin: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      align-items: center;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      font-weight: 650;
      gap: 6px;
      justify-content: center;
      min-height: 34px;
      padding: 7px 11px;
      white-space: nowrap;
    }

    button:disabled {
      cursor: default;
      opacity: .55;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 228px minmax(0, 1fr);
      min-height: 100vh;
    }

    .side-nav {
      background: #111111;
      color: #f6f6f3;
      padding: 18px 14px;
    }

    .brand {
      border-bottom: 1px solid rgba(255, 255, 255, .1);
      margin-bottom: 14px;
      padding: 2px 4px 16px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 780;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .brand-subtitle {
      color: #b7b7ad;
      font-size: 12px;
      line-height: 1.35;
      margin-top: 4px;
    }

    .nav-button {
      background: transparent;
      border: 1px solid transparent;
      color: #deded8;
      justify-content: space-between;
      margin: 2px 0;
      padding: 9px 10px;
      text-align: left;
      width: 100%;
    }

    .nav-button:hover,
    .nav-button.active {
      background: rgba(255, 255, 255, .08);
      border-color: rgba(255, 255, 255, .08);
      color: #fff;
    }

    .nav-count {
      background: rgba(255, 255, 255, .13);
      border-radius: 999px;
      color: #fff;
      font-size: 11px;
      min-width: 22px;
      padding: 2px 7px;
      text-align: center;
    }

    .main {
      min-width: 0;
      padding: 20px;
    }

    .topbar {
      align-items: flex-start;
      display: flex;
      gap: 18px;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 25px;
      letter-spacing: 0;
      line-height: 1.15;
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.4;
      margin-top: 5px;
      max-width: 760px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-primary {
      background: var(--text);
      color: #fff;
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: var(--surface);
      border-color: var(--line);
      color: var(--text);
    }

    .btn-muted {
      background: #ededeb;
      color: var(--text);
    }

    .btn-danger {
      background: var(--red-soft);
      color: var(--red);
    }

    .status-line {
      color: var(--muted);
      min-height: 21px;
      margin-bottom: 12px;
    }

    .status-line.error {
      color: var(--red);
      font-weight: 700;
    }

    .status-line.success {
      color: var(--green);
      font-weight: 700;
    }

    .metric-row {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      margin-bottom: 12px;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }

    .metric-value {
      font-size: 21px;
      font-weight: 780;
      line-height: 1;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .workspace {
      align-items: start;
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(340px, 430px) minmax(0, 1fr);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      min-width: 0;
      padding: 13px;
    }

    .panel-header {
      align-items: baseline;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 15px;
      margin: 0;
    }

    .muted {
      color: var(--muted);
    }

    .success {
      color: var(--green);
    }

    .error {
      color: var(--red);
    }

    .small {
      font-size: 12px;
    }

    .group {
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .group:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .group-title {
      align-items: center;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .group-description {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      margin: -2px 0 8px;
    }

    .card-list {
      display: grid;
      gap: 8px;
    }

    .work-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 3px solid var(--line-strong);
      border-radius: 8px;
      cursor: pointer;
      padding: 10px;
      transition: border-color .12s ease, box-shadow .12s ease, transform .12s ease;
    }

    .work-card:hover,
    .work-card.selected {
      border-color: #b8b6ff;
      border-left-color: var(--accent);
      box-shadow: 0 8px 22px rgba(99, 91, 255, .12);
      transform: translateY(-1px);
    }

    .work-card.failed {
      border-left-color: var(--red);
    }

    .work-card.ready_live {
      border-left-color: var(--green);
    }

    .work-card.scheduled_soon,
    .work-card.stabilizing {
      border-left-color: var(--amber);
    }

    .work-card.signal {
      cursor: default;
    }

    .card-top {
      align-items: center;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    .card-title {
      font-weight: 760;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .card-meta,
    .card-why {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .card-why {
      margin-top: 6px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .pill {
      background: #f1f1ef;
      border: 1px solid #e3e3df;
      border-radius: 999px;
      color: #3f3f39;
      display: inline-flex;
      font-size: 11px;
      gap: 4px;
      line-height: 1.2;
      padding: 4px 7px;
    }

    .pill.ok {
      background: var(--green-soft);
      border-color: #c9ead8;
      color: var(--green);
    }

    .pill.warn {
      background: var(--amber-soft);
      border-color: #f2d9a8;
      color: var(--amber);
    }

    .pill.error {
      background: var(--red-soft);
      border-color: #ffc9c2;
      color: var(--red);
    }

    .pill.info {
      background: var(--blue-soft);
      border-color: #cfe1ff;
      color: var(--blue);
    }

    .empty-state {
      border: 1px dashed var(--line-strong);
      border-radius: 9px;
      color: var(--muted);
      line-height: 1.45;
      padding: 20px;
      text-align: center;
    }

    .object-view {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(0, 1fr) 300px;
      align-items: start;
    }

    .object-header {
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
      padding-bottom: 12px;
    }

    .object-kicker {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 8px;
    }

    .object-title {
      font-size: 21px;
      font-weight: 780;
      line-height: 1.2;
      margin-bottom: 4px;
      overflow-wrap: anywhere;
    }

    .object-summary {
      color: var(--muted);
      line-height: 1.4;
    }

    .field-label {
      color: #383832;
      display: block;
      font-size: 12px;
      font-weight: 760;
      margin: 12px 0 5px;
    }

    input,
    select,
    .html-editor {
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: var(--text);
      padding: 8px 9px;
      width: 100%;
    }

    .editor-toolbar {
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--line-strong);
      border-bottom: 0;
      border-radius: 7px 7px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 5px;
    }

    .editor-toolbar button {
      background: transparent;
      border: 1px solid transparent;
      color: #383832;
      min-height: 28px;
      min-width: 30px;
      padding: 4px 7px;
    }

    .editor-toolbar button:hover,
    .editor-toolbar button:focus {
      background: var(--accent-soft);
      border-color: #d8d5ff;
      outline: none;
    }

    .separator {
      background: var(--line);
      height: 22px;
      margin: 0 2px;
      width: 1px;
    }

    .html-editor {
      border-radius: 0 0 7px 7px;
      line-height: 1.45;
      min-height: 260px;
      outline: none;
      overflow: auto;
    }

    .title-editor {
      min-height: 42px;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
    }

    .coach-box {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      margin-top: 12px;
      padding: 10px;
    }

    .coach-header {
      align-items: center;
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .coach-notes {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-top: 7px;
    }

    .rail {
      display: grid;
      gap: 10px;
    }

    .rail-card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px;
    }

    .rail-title {
      font-size: 13px;
      font-weight: 760;
      margin-bottom: 7px;
    }

    .check-list {
      display: grid;
      gap: 7px;
    }

    .check {
      display: grid;
      gap: 7px;
      grid-template-columns: 22px minmax(0, 1fr);
    }

    .check-dot {
      align-items: center;
      background: #ececea;
      border-radius: 999px;
      color: #77776e;
      display: flex;
      font-size: 9px;
      font-weight: 800;
      height: 18px;
      justify-content: center;
      margin-top: 1px;
      width: 22px;
    }

    .check.ok .check-dot {
      background: var(--green-soft);
      color: var(--green);
    }

    .check.warn .check-dot {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .check.error .check-dot {
      background: var(--red-soft);
      color: var(--red);
    }

    .check-label {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
    }

    .check-detail {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      margin-top: 2px;
    }

    .kv-list {
      display: grid;
      gap: 7px;
    }

    .kv-row {
      border-top: 1px solid var(--line);
      padding-top: 7px;
    }

    .kv-row:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .kv-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      text-transform: uppercase;
    }

    .kv-value {
      line-height: 1.35;
      margin-top: 2px;
      overflow-wrap: anywhere;
    }

    .history-list {
      display: grid;
      gap: 8px;
    }

    .history-row {
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .history-row:first-child {
      border-top: 0;
      padding-top: 0;
    }

    @media (max-width: 1220px) {
      .workspace,
      .object-view {
        grid-template-columns: 1fr;
      }

      .metric-row {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 14px;
      }

      .topbar {
        display: block;
      }

      .top-actions {
        justify-content: flex-start;
        margin-top: 10px;
      }

      .metric-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="side-nav">
      <div class="brand">
        <div class="brand-title">Personal Assistant</div>
        <div class="brand-subtitle">Communication Action Cockpit</div>
      </div>
      <button class="nav-button active" data-view="inbox" onclick="setView('inbox')"><span>Action Inbox</span><span id="navInbox" class="nav-count">0</span></button>
      <button class="nav-button" data-view="active" onclick="setView('active')"><span>Active Communications</span><span id="navActive" class="nav-count">0</span></button>
      <button class="nav-button" data-view="new" onclick="setView('new')"><span>New Communication</span></button>
      <button class="nav-button" data-view="signals" onclick="setView('signals')"><span>Dashboard Signals</span><span id="navSignals" class="nav-count">0</span></button>
      <button class="nav-button" data-view="history" onclick="setView('history')"><span>History</span></button>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="viewTitle">Action Inbox</h1>
          <div id="viewSubtitle" class="subtitle">Loading Personal Assistant...</div>
        </div>
        <div class="top-actions">
          <button class="btn-secondary" onclick="syncDashboard()">Sync Dashboard Now</button>
          <button class="btn-muted" onclick="loadApp(true)">Refresh</button>
        </div>
      </div>

      <div id="status" class="status-line"></div>
      <section id="metrics" class="metric-row"></section>

      <div class="workspace">
        <section id="content" class="panel"></section>
        <section id="detail" class="panel"></section>
      </div>
    </main>
  </div>

  <script>
    let appContext = null;
    let currentView = 'inbox';
    let currentDetail = null;
    let selectedSelection = '';
    let actionDefaults = {};
    let savedEditorRanges = {};
    let isBusy = false;
    let aiDraftAttempts = {};
    let aiMetadata = {};

    function setStatus(message, mode) {
      const el = document.getElementById('status');
      el.textContent = message || '';
      el.className = 'status-line ' + (mode || '');
    }

    function setBusy(value) {
      isBusy = Boolean(value);
      Array.from(document.querySelectorAll('button, input, select')).forEach(el => {
        el.disabled = isBusy;
      });
      ['messageTitle', 'messageBody'].forEach(id => {
        const editor = document.getElementById(id);
        if (editor) editor.contentEditable = isBusy ? 'false' : 'true';
      });
    }

    function serverCall(fnName, args, onSuccess, options) {
      const useBusy = !options || options.busy !== false;
      if (useBusy) setBusy(true);
      const runner = google.script.run
        .withSuccessHandler(result => {
          if (useBusy) setBusy(false);
          if (onSuccess) onSuccess(result);
        })
        .withFailureHandler(error => {
          if (useBusy) setBusy(false);
          setStatus(error && error.message ? error.message : String(error), 'error');
          if (options && options.onError) options.onError(error);
        });
      runner[fnName].apply(runner, args || []);
    }

    function loadApp(keepDetail) {
      setStatus('Loading communication cockpit...');
      serverCall('getCommunicationAppContext', [], context => {
        appContext = context;
        setStatus('Ready.', 'success');
        renderShell();
        if (keepDetail && selectedSelection) {
          openDetail(selectedSelection);
        } else if (!currentDetail) {
          renderDetailEmpty();
        }
      });
    }

    function setView(view) {
      currentView = view;
      currentDetail = null;
      selectedSelection = '';
      renderShell();
      renderDetailEmpty();
    }

    function renderShell() {
      if (!appContext) return;
      renderNav();
      renderMetrics();
      renderContent();
    }

    function renderNav() {
      document.querySelectorAll('.nav-button').forEach(button => {
        button.classList.toggle('active', button.dataset.view === currentView);
      });
      document.getElementById('navInbox').textContent = appContext.stats.inbox || 0;
      document.getElementById('navActive').textContent = appContext.stats.activeCommunications || 0;
      document.getElementById('navSignals').textContent = appContext.stats.pendingSignals || 0;
    }

    function renderMetrics() {
      const sync = appContext.dashboard.config || {};
      const metrics = [
        ['Needs review', appContext.stats.needsReview || 0],
        ['Ready live', appContext.stats.readyLive || 0],
        ['Needs context', appContext.stats.needsContext || 0],
        ['Failures', appContext.stats.failed || 0],
        ['Stabilizing', appContext.actionInbox && appContext.actionInbox.summary.stabilizing || 0],
        ['Last sync', sync.lastSyncMode || 'Unknown']
      ];
      document.getElementById('metrics').innerHTML = metrics.map(item =>
        '<div class="metric"><div class="metric-value">' + escapeHtml(item[1]) + '</div><div class="metric-label">' + escapeHtml(item[0]) + '</div></div>'
      ).join('');
    }

    function renderContent() {
      const titles = {
        inbox: ['Action Inbox', 'Grouped by the next PM decision: review, test, approve, add context, or wait.'],
        active: ['Active Communications', 'Parent threads with current state, next expected step, and Slack routing.'],
        new: ['New Communication', 'Start from a lane scaffold, then edit the final message directly.'],
        signals: ['Dashboard Signals', 'What the dashboard automation saw, what is stabilizing, and what it decided.'],
        history: ['History', 'Recently completed communication events and their Slack links.']
      };
      const copy = titles[currentView] || titles.inbox;
      document.getElementById('viewTitle').textContent = copy[0];
      document.getElementById('viewSubtitle').textContent = copy[1];

      if (currentView === 'inbox') renderInbox();
      if (currentView === 'active') renderActive();
      if (currentView === 'new') renderNew();
      if (currentView === 'signals') renderSignals();
      if (currentView === 'history') renderHistory();
    }

    function renderInbox() {
      const groups = appContext.actionInbox && appContext.actionInbox.groups || [];
      document.getElementById('content').innerHTML =
        panelHeaderHtml('Inbox', (appContext.actionInbox && appContext.actionInbox.summary.total || 0) + ' actions') +
        (groups.length ? groups.map(renderInboxGroup).join('') : emptyHtml('No PM action is waiting right now.'));
    }

    function renderInboxGroup(group) {
      return '<div class="group">' +
        '<div class="group-title"><h2>' + escapeHtml(group.label) + '</h2><span class="pill">' + group.items.length + '</span></div>' +
        '<div class="group-description">' + escapeHtml(group.description || '') + '</div>' +
        '<div class="card-list">' + group.items.map(renderActionCard).join('') + '</div>' +
        '</div>';
    }

    function renderActionCard(item) {
      const clickable = item.selection ? ' onclick="openDetail(' + quote(item.selection) + ')"' : '';
      const selected = selectedSelection === item.selection ? ' selected' : '';
      const classes = ['work-card', item.decisionState || '', item.kind === 'signal' ? 'signal' : '', selected].filter(Boolean).join(' ');
      const routeChips = item.kind === 'draft' ?
        ((item.hasTest ? pillHtml('Test sent', 'ok') : pillHtml('No test yet', '')) +
        (item.hasLive ? pillHtml('Live sent', 'ok') : pillHtml('Live pending', 'warn'))) :
        pillHtml(item.decisionLabel || item.status || 'Signal', item.status === 'Needs Reason' ? 'warn' : 'info');
      return '<div class="' + classes + '"' + clickable + '>' +
        '<div class="card-top">' + pillHtml(item.decisionLabel || item.status || 'Draft', stateMode(item.decisionState)) +
        '<strong class="small">' + escapeHtml(item.nextAction || '') + '</strong></div>' +
        '<div class="card-title">' + escapeHtml(item.subject || 'Untitled communication') + '</div>' +
        '<div class="card-meta">' + escapeHtml([item.eventName || item.eventKey, item.owner || 'Owner not set', item.source || ''].filter(Boolean).join(' | ')) + '</div>' +
        '<div class="card-why">' + escapeHtml(item.why || '') + '</div>' +
        '<div class="pill-row">' + routeChips + pillHtml(item.lane || item.recordType || 'No lane') + '</div>' +
        '</div>';
    }

    function renderActive() {
      const items = appContext.activeCommunications || [];
      document.getElementById('content').innerHTML =
        panelHeaderHtml('Active communications', items.length + ' flows') +
        (items.length ? '<div class="card-list">' + items.map(renderFlowCard).join('') + '</div>' : emptyHtml('No active communication flows yet.'));
    }

    function renderFlowCard(item) {
      const selected = selectedSelection === item.selection ? ' selected' : '';
      return '<div class="work-card ready_live' + selected + '" onclick="openDetail(' + quote(item.selection) + ')">' +
        '<div class="card-top">' + pillHtml(item.status || 'Active', 'ok') + '<strong class="small">Continue flow</strong></div>' +
        '<div class="card-title">' + escapeHtml(item.subject) + '</div>' +
        '<div class="card-meta">Current: ' + escapeHtml(item.currentState) + '</div>' +
        '<div class="card-why">Expected next: ' + escapeHtml(item.expectedNext || 'No expected next step') + '</div>' +
        '<div class="pill-row">' + (item.liveSlackUrl ? linkPillHtml('Live anchor', item.liveSlackUrl, 'ok') : pillHtml('No live anchor', 'warn')) +
        (item.testSlackUrl ? linkPillHtml('Test anchor', item.testSlackUrl, 'ok') : '') +
        pillHtml(item.lane || 'No lane') + '</div></div>';
    }

    function renderNew() {
      const options = appContext.newCommunicationOptions || [];
      document.getElementById('content').innerHTML =
        panelHeaderHtml('Start a communication', 'Choose a lane') +
        '<div class="card-list">' + options.map(option =>
          '<div class="work-card" onclick="openDetail(' + quote(option.value) + ')">' +
          '<div class="card-top">' + pillHtml('New', 'info') + '<strong class="small">Create draft</strong></div>' +
          '<div class="card-title">' + escapeHtml(option.label.replace(/^\+\s*/, '')) + '</div>' +
          '<div class="card-why">Loads the matching scaffold and flow policy, then lets you edit the final message.</div>' +
          '</div>'
        ).join('') + '</div>';
    }

    function renderSignals() {
      const pending = appContext.dashboard.pending || [];
      const triggers = appContext.dashboard.recentTriggers || [];
      document.getElementById('content').innerHTML =
        panelHeaderHtml('Pending evaluations', pending.length + ' pending') +
        (pending.length ? '<div class="card-list">' + pending.map(renderSignalCard).join('') + '</div>' : emptyHtml('No pending dashboard signals.')) +
        '<div style="height:12px"></div>' +
        panelHeaderHtml('Recent decisions', triggers.length + ' recent') +
        (triggers.length ? '<div class="card-list">' + triggers.map(renderTriggerCard).join('') + '</div>' : emptyHtml('No trigger log rows yet.'));
    }

    function renderSignalCard(item) {
      return '<div class="work-card stabilizing signal">' +
        '<div class="card-top">' + pillHtml(item.status || 'Pending Evaluation', item.status === 'Needs Reason' ? 'warn' : 'info') +
        '<strong class="small">' + escapeHtml(item.stablePolls ? 'Stable polls ' + item.stablePolls : 'Watching') + '</strong></div>' +
        '<div class="card-title">' + escapeHtml(item.subject || item.flowId) + '</div>' +
        '<div class="card-why">' + escapeHtml(item.triggerCandidate || item.eventName || 'Dashboard change under evaluation') + '</div>' +
        (item.error ? '<div class="pill-row">' + pillHtml(item.error, 'error') + '</div>' : '') +
        '</div>';
    }

    function renderTriggerCard(item) {
      return '<div class="work-card">' +
        '<div class="card-top">' + pillHtml(item.status || 'Logged', item.error ? 'error' : item.queueId ? 'ok' : '') +
        '<span class="small">' + escapeHtml(formatDateTime(item.createdAt)) + '</span></div>' +
        '<div class="card-title">' + escapeHtml(item.subject || item.candidate || item.flowId) + '</div>' +
        '<div class="card-meta">' + escapeHtml(item.eventName || item.eventKey || 'No event') + '</div>' +
        '<div class="pill-row">' + (item.queueId ? pillHtml('Draft ' + item.queueId, 'ok') : pillHtml('No draft')) +
        (item.error ? pillHtml(item.error, 'error') : '') + '</div></div>';
    }

    function renderHistory() {
      const items = appContext.history || [];
      document.getElementById('content').innerHTML =
        panelHeaderHtml('Recent history', items.length + ' events') +
        (items.length ? '<div class="card-list">' + items.map(renderHistoryCard).join('') + '</div>' : emptyHtml('No history recorded yet.'));
    }

    function renderHistoryCard(item) {
      return '<div class="work-card ready_live">' +
        '<div class="card-top">' + pillHtml(item.status || 'Done', 'ok') + '<span class="small">' + escapeHtml(formatDateTime(item.completedAt)) + '</span></div>' +
        '<div class="card-title">' + escapeHtml(item.subject) + '</div>' +
        '<div class="card-meta">' + escapeHtml(item.eventName || item.eventKey) + '</div>' +
        '<div class="pill-row">' + (item.liveSlackUrl ? linkPillHtml('Live Slack', item.liveSlackUrl, 'ok') : pillHtml('No live link')) +
        (item.testSlackUrl ? linkPillHtml('Test Slack', item.testSlackUrl, 'ok') : '') + '</div></div>';
    }

    function openDetail(selection) {
      selectedSelection = selection || '';
      setStatus('Loading communication detail...');
      serverCall('getCommunicationDetail', [selectedSelection], detail => {
        currentDetail = detail;
        if (!detail || !detail.ok) {
          setStatus(detail && detail.message ? detail.message : 'Unable to load detail.', 'error');
          return;
        }
        setStatus('Ready.', 'success');
        renderShell();
        renderDetail();
      });
    }

    function renderDetailEmpty() {
      document.getElementById('detail').innerHTML =
        '<div class="empty-state"><strong>Select an action.</strong><br>Open a draft, flow, or new communication type to see the editor, readiness checklist, routing state, and source evidence.</div>';
    }

    function renderDetail() {
      const detail = currentDetail;
      if (!detail || !detail.ok) return renderDetailEmpty();

      const queue = detail.queue || {};
      const flow = detail.flow || {};
      const subject = queue.subject || flow.subject || 'New communication';
      const actions = detail.actions || [];
      actionDefaults = {};
      actions.forEach(action => {
        actionDefaults[action.value] = action.defaults || {};
      });
      aiMetadata = {
        model: detail.ai && detail.ai.modelUsed || detail.ai && detail.ai.model || '',
        generatedAt: detail.ai && detail.ai.generatedAt || '',
        redraftedAt: detail.ai && detail.ai.redraftedAt || ''
      };

      document.getElementById('detail').innerHTML =
        '<div class="object-view">' +
          '<div class="object-main">' +
            '<div class="object-header">' +
              '<div class="object-kicker">' + pillHtml(queue.status || flow.status || detail.mode || 'Draft', queue.error ? 'error' : 'info') +
              pillHtml(queue.eventName || flow.currentState || 'No event') + '</div>' +
              '<div class="object-title">' + escapeHtml(subject) + '</div>' +
              '<div class="object-summary">' + escapeHtml(buildDetailSummary(detail)) + '</div>' +
            '</div>' +
            '<label class="field-label" for="flowAction">Action</label>' +
            '<select id="flowAction" onchange="applyActionDefaults()">' + actions.map(action =>
              '<option value="' + escapeAttr(action.value) + '" data-event-key="' + escapeAttr(action.eventKey || '') + '">' + escapeHtml(action.label) + '</option>'
            ).join('') + '</select>' +
            '<label class="field-label" for="messageTitle">Title</label>' +
            toolbarHtml('messageTitle', false) +
            '<div id="messageTitle" class="html-editor title-editor" contenteditable="true"></div>' +
            '<label class="field-label" for="messageBody">Body</label>' +
            toolbarHtml('messageBody', true) +
            '<div id="messageBody" class="html-editor" contenteditable="true"></div>' +
            '<div class="action-row">' +
              '<button class="btn-secondary" onclick="saveDraft()">' + escapeHtml(detail.mode === 'queue' ? 'Save' : 'Queue Draft') + '</button>' +
              '<button class="btn-secondary" onclick="sendTest()">Send Test</button>' +
              '<button class="btn-accent" onclick="approveLive()">Approve & Send</button>' +
              (detail.mode === 'queue' ? '<button class="btn-danger" onclick="discardDraft()">Discard</button>' : '') +
            '</div>' +
          '</div>' +
          '<aside class="rail">' +
            renderCoachBox(detail) +
            renderReadinessPanel(detail) +
            renderRoutePanel(detail) +
            renderFlowPanel(detail) +
            renderEvidencePanel(detail) +
            renderHistoryPanel(detail.history || []) +
          '</aside>' +
        '</div>';

      const actionSelect = document.getElementById('flowAction');
      if (actionSelect && actions.length) actionSelect.value = actions[0].value;
      document.getElementById('messageTitle').innerHTML = queue.messageTitleHtml || escapeHtml(queue.messageTitle || queue.subject || '');
      document.getElementById('messageBody').innerHTML = queue.messageBodyHtml || '';
      if ((detail.mode === 'new' || detail.mode === 'flow') && actionSelect && actionSelect.value) applyActionDefaults();
      bindEditors();
      updateClientReadiness();
      maybeGenerateInitialAiDraft();
    }

    function buildDetailSummary(detail) {
      if (detail.mode === 'new') return 'Start a new parent communication. The scaffold is a starting point; the edited title and body are the final message.';
      if (detail.mode === 'flow') return 'Continue this parent communication using the expected next step or a controlled detour.';
      if (detail.queue && detail.queue.error) return 'This draft needs attention before it can be tested or sent live.';
      if (detail.queue && detail.queue.testSlackUrl) return 'Sandbox test exists. Review the content and approve the live send when ready.';
      return 'Review the final message, send a sandbox test, then approve the live Slack send.';
    }

    function renderCoachBox(detail) {
      const ai = detail.ai || {};
      const label = ai.enabled ? 'Gemini Copy Coach' : 'Copy Coach';
      const body = ai.enabled ?
        'Use AI to tighten the Slack formatting and wording while preserving your intent.' :
        'Gemini is not configured. The deterministic template scaffold remains available.';
      return '<div class="rail-card coach-box">' +
        '<div class="coach-header"><strong>' + escapeHtml(label) + '</strong><button class="btn-secondary" onclick="redraftWithAi()">AI Re-draft</button></div>' +
        '<div id="coachStatus" class="small muted">' + escapeHtml(body) + '</div>' +
        '<div id="coachNotes" class="coach-notes"></div>' +
        '</div>';
    }

    function renderReadinessPanel(detail) {
      const readiness = detail.readiness || { items: [] };
      return '<div class="rail-card"><div class="rail-title">Readiness</div>' +
        '<div class="check-list">' + (readiness.items || []).map((item, index) => renderCheck(item, index)).join('') + '</div></div>';
    }

    function renderCheck(item, index) {
      const state = item.ok ? 'ok' : item.state || 'warn';
      return '<div class="check ' + escapeAttr(state) + '" data-check-index="' + index + '">' +
        '<div class="check-dot">' + (item.ok ? 'OK' : '!') + '</div>' +
        '<div><div class="check-label">' + escapeHtml(item.label) + '</div>' +
        '<div class="check-detail">' + escapeHtml(item.detail || '') + '</div></div></div>';
    }

    function renderRoutePanel(detail) {
      const queue = detail.queue || {};
      const flow = detail.flow || {};
      const readiness = detail.readiness || {};
      const routes = readiness.routes || {};
      return '<div class="rail-card"><div class="rail-title">Slack routes</div><div class="kv-list">' +
        kvHtml('Test route', queue.testSlackUrl || flow.testAnchorUrl ? linkHtml('Open sandbox message', queue.testSlackUrl || flow.testAnchorUrl) : (routes.testChannel ? 'Ready: ' + routes.testChannel : 'Not resolved'), Boolean(queue.testSlackUrl || flow.testAnchorUrl)) +
        kvHtml('Live route', queue.slackUrl || flow.anchorUrl ? linkHtml('Open live message', queue.slackUrl || flow.anchorUrl) : (routes.liveChannel ? 'Ready: ' + routes.liveChannel : 'Not resolved'), Boolean(queue.slackUrl || flow.anchorUrl)) +
        '</div></div>';
    }

    function renderFlowPanel(detail) {
      const flow = detail.flow || {};
      return '<div class="rail-card"><div class="rail-title">Flow state</div><div class="kv-list">' +
        kvHtml('Current', flow.currentState || 'No parent flow yet') +
        kvHtml('Expected next', flow.expectedNext || 'Choose an action') +
        kvHtml('Detours', flow.availableDetours || 'None listed') +
        kvHtml('Last confirmed', flow.lastConfirmedAt ? formatDateTime(flow.lastConfirmedAt) : 'Not confirmed yet') +
        '</div></div>';
    }

    function renderEvidencePanel(detail) {
      const evidence = detail.evidence || { items: [] };
      return '<div class="rail-card"><div class="rail-title">Source evidence</div>' +
        (evidence.items && evidence.items.length ? '<div class="kv-list">' + evidence.items.map(item => kvHtml(item.label, formatMaybeDate(item.value), true)).join('') + '</div>' : '<div class="muted small">No source evidence found.</div>') +
        '</div>';
    }

    function renderHistoryPanel(history) {
      return '<div class="rail-card"><div class="rail-title">Recent history</div>' +
        (history.length ? '<div class="history-list">' + history.slice(0, 6).map(item =>
          '<div class="history-row"><strong class="small">' + escapeHtml(item.eventName || item.eventKey) + '</strong>' +
          '<div class="card-meta">' + escapeHtml(item.status || '') + ' | ' + escapeHtml(formatDateTime(item.completedAt)) + '</div>' +
          '<div class="pill-row">' + (item.liveSlackUrl ? linkPillHtml('Live', item.liveSlackUrl, 'ok') : '') +
          (item.testSlackUrl ? linkPillHtml('Test', item.testSlackUrl, 'ok') : '') + '</div></div>'
        ).join('') + '</div>' : '<div class="muted small">No history for this communication yet.</div>') +
        '</div>';
    }

    function applyActionDefaults() {
      const select = document.getElementById('flowAction');
      if (!select) return;
      const defaults = actionDefaults[select.value];
      if (!defaults) return;
      document.getElementById('messageTitle').innerHTML = defaults.messageTitleHtml || escapeHtml(defaults.messageTitle || '');
      document.getElementById('messageBody').innerHTML = defaults.messageBodyHtml || '';
      aiMetadata = {};
      updateClientReadiness();
    }

    function collectForm() {
      const action = document.getElementById('flowAction');
      const selected = action && action.options[action.selectedIndex];
      const titleEditor = document.getElementById('messageTitle');
      const bodyEditor = document.getElementById('messageBody');
      const queue = currentDetail && currentDetail.queue || {};
      return {
        selection: selectedSelection,
        queueId: queue.queueId || '',
        flowId: queue.flowId || '',
        flowAction: action ? action.value : '',
        eventKey: selected ? selected.dataset.eventKey || '' : '',
        subject: stripHtmlFromElement(titleEditor) || queue.subject || '',
        owner: queue.owner || '',
        priority: queue.priority || '',
        messageTitle: stripHtmlFromElement(titleEditor),
        messageTitleHtml: titleEditor ? titleEditor.innerHTML || '' : '',
        messageBodyHtml: bodyEditor ? bodyEditor.innerHTML || '' : '',
        aiModel: aiMetadata.model || '',
        aiGeneratedAt: aiMetadata.generatedAt || '',
        aiRedraftedAt: aiMetadata.redraftedAt || ''
      };
    }

    function validateForm(form) {
      const missing = [];
      if (!form.eventKey) missing.push('action');
      if (!hasVisibleText(form.messageTitleHtml)) missing.push('title');
      if (!hasVisibleText(form.messageBodyHtml)) missing.push('body');
      if (missing.length) {
        setStatus('Add ' + missing.join(', ') + ' before continuing.', 'error');
        return false;
      }
      return true;
    }

    function saveDraft() {
      const form = collectForm();
      if (!validateForm(form)) return;
      const fn = currentDetail && currentDetail.mode === 'queue' ? 'saveCommunicationDraft' : 'createCommunication';
      setStatus(fn === 'saveCommunicationDraft' ? 'Saving draft...' : 'Queueing draft...');
      serverCall(fn, [form], result => afterAction(result, 'Draft saved.'));
    }

    function sendTest() {
      const form = collectForm();
      if (!validateForm(form)) return;
      setStatus('Sending test to Slack...');
      serverCall('sendCommunicationTest', [form], result => afterAction(result, 'Test sent to Slack.'));
    }

    function approveLive() {
      const form = collectForm();
      if (!validateForm(form)) return;
      setStatus('Approving and sending live...');
      serverCall('approveCommunication', [form], result => {
        setStatus(result && result.message ? result.message : 'Approved and sent.', 'success');
        currentDetail = null;
        selectedSelection = '';
        loadApp(false);
      });
    }

    function discardDraft() {
      const form = collectForm();
      if (!form.queueId) return setStatus('Only queued drafts can be discarded.', 'error');
      setStatus('Discarding draft...');
      serverCall('discardCommunication', [form], result => {
        setStatus(result && result.message ? result.message : 'Draft discarded.', 'success');
        currentDetail = null;
        selectedSelection = '';
        loadApp(false);
      });
    }

    function syncDashboard() {
      setStatus('Syncing dashboard...');
      serverCall('syncDashboardFromWebApp', [], result => {
        setStatus(result && result.message ? result.message : 'Dashboard sync complete.', 'success');
        loadApp(false);
      });
    }

    function afterAction(result, fallbackMessage) {
      setStatus(result && result.message ? result.message : fallbackMessage, 'success');
      const queueId = result && result.queue && result.queue.queueId || result && result.queueId || currentDetail && currentDetail.queue && currentDetail.queue.queueId || '';
      selectedSelection = queueId ? 'queue:' + queueId : selectedSelection;
      currentDetail = result && result.ok ? result : currentDetail;
      loadApp(true);
    }

    function maybeGenerateInitialAiDraft() {
      if (!currentDetail || !currentDetail.ai || !currentDetail.ai.needsInitialDraft) return;
      if (!currentDetail.ai.enabled) {
        setCoachStatus('Gemini is not configured. Template scaffold loaded instead.', '');
        return;
      }
      if (aiDraftAttempts[selectedSelection]) return;
      aiDraftAttempts[selectedSelection] = true;
      setCoachStatus('Asking Gemini for an initial draft...', '');
      serverCall('generateInitialCommunicationAiDraft', [collectForm()], result => {
        applyAiDraft(result, 'initial');
      }, {
        busy: false,
        onError: error => setCoachStatus(error && error.message ? error.message : String(error), 'error')
      });
    }

    function redraftWithAi() {
      const form = collectForm();
      if (!hasVisibleText(form.messageTitleHtml) || !hasVisibleText(form.messageBodyHtml)) {
        setStatus('Add a title and body before asking AI to re-draft.', 'error');
        return;
      }
      setCoachStatus('Re-drafting with Gemini...', '');
      serverCall('redraftCommunicationWithAi', [form], result => {
        applyAiDraft(result, 'redraft');
      }, {
        busy: false,
        onError: error => setCoachStatus(error && error.message ? error.message : String(error), 'error')
      });
    }

    function applyAiDraft(result, mode) {
      if (!result || !result.ok) {
        setCoachStatus(result && result.message ? result.message : 'AI draft was not available.', 'error');
        return;
      }
      if (mode === 'redraft' && result.source !== 'gemini') {
        setCoachStatus(result.message || 'AI re-draft is unavailable; keeping your current edits.', '');
        renderCoachNotes(result);
        return;
      }
      const titleEditor = document.getElementById('messageTitle');
      const bodyEditor = document.getElementById('messageBody');
      if (titleEditor && result.titleHtml) titleEditor.innerHTML = result.titleHtml;
      if (bodyEditor && result.bodyHtml) bodyEditor.innerHTML = result.bodyHtml;
      aiMetadata.model = result.model || aiMetadata.model || '';
      if (mode === 'redraft') aiMetadata.redraftedAt = result.generatedAt || new Date().toISOString();
      else aiMetadata.generatedAt = result.generatedAt || new Date().toISOString();
      const source = result.source === 'gemini' ? 'Gemini draft loaded. Review and save when ready.' : (result.message || 'Template scaffold loaded.');
      setCoachStatus(source, result.source === 'gemini' ? 'success' : '');
      renderCoachNotes(result);
      updateClientReadiness();
    }

    function setCoachStatus(message, mode) {
      const el = document.getElementById('coachStatus');
      if (!el) return;
      el.textContent = message || '';
      el.className = 'small ' + (mode === 'success' ? 'success' : mode === 'error' ? 'error' : 'muted');
    }

    function renderCoachNotes(result) {
      const el = document.getElementById('coachNotes');
      if (!el) return;
      const notes = []
        .concat(result.formattingNotes || [])
        .concat((result.missingContext || []).map(item => 'Missing context: ' + item))
        .concat(result.warnings || []);
      el.innerHTML = notes.length ? '<ul>' + notes.map(note => '<li>' + escapeHtml(note) + '</li>').join('') + '</ul>' : '';
    }

    function updateClientReadiness() {
      updateCheck(0, hasVisibleText(document.getElementById('messageTitle') && document.getElementById('messageTitle').innerHTML), 'Title is present.', 'Add a concise title.');
      updateCheck(1, hasVisibleText(document.getElementById('messageBody') && document.getElementById('messageBody').innerHTML), 'Body is present.', 'Add the stakeholder message body.');
    }

    function updateCheck(index, ok, okText, badText) {
      const node = document.querySelector('[data-check-index="' + index + '"]');
      if (!node) return;
      node.classList.toggle('ok', Boolean(ok));
      node.classList.toggle('warn', !ok);
      const dot = node.querySelector('.check-dot');
      const detail = node.querySelector('.check-detail');
      if (dot) dot.textContent = ok ? 'OK' : '!';
      if (detail) detail.textContent = ok ? okText : badText;
    }

    function bindEditors() {
      ['messageTitle', 'messageBody'].forEach(id => {
        const editor = document.getElementById(id);
        if (!editor) return;
        editor.onkeyup = () => {
          saveEditorSelection(id);
          updateClientReadiness();
        };
        editor.onmouseup = () => saveEditorSelection(id);
        editor.onfocus = () => saveEditorSelection(id);
        editor.onkeydown = event => handleEditorKeydown(event, id);
      });
    }

    function saveEditorSelection(editorId) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return;
      const editor = document.getElementById(editorId);
      const range = selection.getRangeAt(0);
      if (editor && editor.contains(range.commonAncestorContainer)) {
        savedEditorRanges[editorId] = range.cloneRange();
      }
    }

    function restoreEditorSelection(editorId) {
      const editor = document.getElementById(editorId);
      if (!editor) return;
      editor.focus();
      const range = savedEditorRanges[editorId];
      if (!range) return;
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function formatEditor(event, editorId, command) {
      event.preventDefault();
      restoreEditorSelection(editorId);
      document.execCommand(command, false, null);
      saveEditorSelection(editorId);
      updateClientReadiness();
    }

    function addLink(event, editorId) {
      event.preventDefault();
      restoreEditorSelection(editorId);
      const url = window.prompt('Link URL');
      if (!url) return;
      document.execCommand('createLink', false, url);
      saveEditorSelection(editorId);
      updateClientReadiness();
    }

    function handleEditorKeydown(event, editorId) {
      saveEditorSelection(editorId);
      if (editorId === 'messageTitle' && event.key === 'Enter') {
        event.preventDefault();
        return;
      }
      if (editorId !== 'messageBody' || event.key !== 'Tab') return;
      event.preventDefault();
      document.execCommand(event.shiftKey ? 'outdent' : 'indent', false, null);
      saveEditorSelection(editorId);
    }

    function toolbarHtml(editorId, allowLists) {
      return '<div class="editor-toolbar">' +
        '<button type="button" title="Bold" onmousedown="formatEditor(event, ' + quote(editorId) + ', ' + quote('bold') + ')"><strong>B</strong></button>' +
        '<button type="button" title="Italic" onmousedown="formatEditor(event, ' + quote(editorId) + ', ' + quote('italic') + ')"><em>I</em></button>' +
        '<span class="separator"></span>' +
        (allowLists ?
          '<button type="button" title="Bullet list" onmousedown="formatEditor(event, ' + quote(editorId) + ', ' + quote('insertUnorderedList') + ')">Bullets</button>' +
          '<button type="button" title="Numbered list" onmousedown="formatEditor(event, ' + quote(editorId) + ', ' + quote('insertOrderedList') + ')">1.</button>' +
          '<button type="button" title="Decrease list level" onmousedown="formatEditor(event, ' + quote(editorId) + ', ' + quote('outdent') + ')">Out</button>' +
          '<button type="button" title="Increase list level" onmousedown="formatEditor(event, ' + quote(editorId) + ', ' + quote('indent') + ')">In</button>' +
          '<span class="separator"></span>' : '') +
        '<button type="button" title="Add link" onmousedown="addLink(event, ' + quote(editorId) + ')">Link</button>' +
        '<button type="button" title="Remove link" onmousedown="formatEditor(event, ' + quote(editorId) + ', ' + quote('unlink') + ')">Unlink</button>' +
      '</div>';
    }

    function panelHeaderHtml(title, meta) {
      return '<div class="panel-header"><h2>' + escapeHtml(title) + '</h2><span class="muted small">' + escapeHtml(meta || '') + '</span></div>';
    }

    function kvHtml(label, value, isHtml) {
      return '<div class="kv-row"><div class="kv-label">' + escapeHtml(label) + '</div><div class="kv-value">' + (isHtml ? value : escapeHtml(value || '')) + '</div></div>';
    }

    function pillHtml(text, mode) {
      return '<span class="pill ' + escapeAttr(mode || '') + '">' + escapeHtml(text || '') + '</span>';
    }

    function linkPillHtml(text, url, mode) {
      return '<a class="pill ' + escapeAttr(mode || '') + '" href="' + escapeAttr(url) + '" target="_blank">' + escapeHtml(text) + '</a>';
    }

    function linkHtml(text, url) {
      return '<a href="' + escapeAttr(url) + '" target="_blank">' + escapeHtml(text) + '</a>';
    }

    function emptyHtml(text) {
      return '<div class="empty-state">' + escapeHtml(text) + '</div>';
    }

    function stateMode(state) {
      if (state === 'failed') return 'error';
      if (state === 'ready_live') return 'ok';
      if (state === 'scheduled_soon' || state === 'stabilizing' || state === 'needs_context') return 'warn';
      return 'info';
    }

    function hasVisibleText(html) {
      const scratch = document.createElement('div');
      scratch.innerHTML = html || '';
      return Boolean(String(scratch.textContent || '').trim());
    }

    function stripHtmlFromElement(el) {
      return el ? String(el.textContent || '').trim() : '';
    }

    function formatMaybeDate(value) {
      if (!value) return '';
      const text = String(value);
      if (/^\d{4}-\d{2}-\d{2}T/.test(text)) return formatDateTime(text);
      return escapeHtml(text);
    }

    function formatDateTime(value) {
      if (!value) return '';
      const text = String(value);
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
      const parsed = new Date(text);
      if (isNaN(parsed.getTime())) return text;
      return parsed.toLocaleString([], {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    function quote(value) {
      return JSON.stringify(String(value || ''));
    }

    function escapeHtml(value) {
      const scratch = document.createElement('div');
      scratch.textContent = value == null ? '' : String(value);
      return scratch.innerHTML;
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/"/g, '&quot;');
    }

    renderDetailEmpty();
    loadApp(false);
  </script>
</body>
</html>

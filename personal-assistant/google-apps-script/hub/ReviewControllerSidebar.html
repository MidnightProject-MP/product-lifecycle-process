<!doctype html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #202124;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #fff;
    }

    body.wide {
      padding: 18px 20px;
    }

    label {
      display: block;
      margin: 12px 0 4px;
      color: #3c4043;
      font-weight: 700;
    }

    select,
    input,
    textarea {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 8px;
      font: inherit;
      color: #202124;
      background: #fff;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: .62;
    }

    .mode-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
    }

    .mode-toggle {
      font-size: 12px;
      padding: 7px 9px;
    }

    .primary {
      background: #1a73e8;
      color: #fff;
    }

    .secondary {
      background: #e8f0fe;
      color: #174ea6;
    }

    .plain {
      background: #f1f3f4;
      color: #202124;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    body.wide textarea {
      min-height: 96px;
    }

    .meta {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
      margin-top: 12px;
    }

    .meta div {
      margin: 0 0 6px;
    }

    .meta div:last-child {
      margin-bottom: 0;
    }

    .key {
      color: #5f6368;
      font-weight: 700;
    }

    .preview-title {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #3c4043;
      font-weight: 700;
    }

    .preview-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .preview-muted {
      color: #5f6368;
      font-size: 12px;
      font-weight: 400;
      margin-bottom: 8px;
    }

    .status {
      margin: 10px 0;
      min-height: 18px;
      color: #5f6368;
    }

    .error {
      color: #a50e0e;
      font-weight: 700;
    }

    .success {
      color: #137333;
      font-weight: 700;
    }

    a {
      color: #1a73e8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="mode-bar">
    <button class="plain mode-toggle" id="modeToggle" onclick="toggleWorkspaceMode()" hidden>Expand Workspace</button>
  </div>
  <div id="status" class="status">Loading communication console...</div>
  <div id="app" hidden>
    <label for="communicationSelect">Communication</label>
    <select id="communicationSelect"></select>

    <label for="flowAction">Action</label>
    <select id="flowAction"></select>

    <label for="subjectInput">Subject</label>
    <input id="subjectInput" type="text" placeholder="Example: May Prod Release">

    <label for="ownerInput">Owner</label>
    <input id="ownerInput" type="text" placeholder="Communication owner">

    <label for="what">What changed?</label>
    <textarea id="what"></textarea>

    <label for="soWhat">Why it matters</label>
    <textarea id="soWhat"></textarea>

    <label for="whatsNext">What happens next?</label>
    <textarea id="whatsNext"></textarea>

    <div class="meta">
      <div class="preview-title">
        <span>Message preview</span>
        <a id="anchor" href="#" target="_blank" hidden>Open Slack anchor</a>
      </div>
      <div id="previewMeta" class="preview-muted"></div>
      <div id="messagePreview" class="preview-text">Preview will appear here.</div>
    </div>

    <div class="actions">
      <button class="secondary" id="queueBtn" onclick="queueDraft()">Queue up Draft</button>
      <button class="primary" id="approveBtn" onclick="approveDraft()">Approve & Send</button>
    </div>
  </div>

  <script>
    let currentContext = null;
    let actionDefaults = {};
    let consoleMode = 'sidebar';
    let previewTimer = null;
    let previewRequestId = 0;

    function setStatus(message, mode) {
      const el = document.getElementById('status');
      el.textContent = message || '';
      el.className = 'status ' + (mode || '');
    }

    function setBusy(isBusy) {
      ['communicationSelect', 'flowAction', 'subjectInput', 'ownerInput', 'what', 'soWhat', 'whatsNext', 'queueBtn', 'approveBtn', 'modeToggle'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = isBusy;
      });
    }

    function applyConsoleMode(mode) {
      consoleMode = mode === 'wide' ? 'wide' : 'sidebar';
      document.body.classList.toggle('wide', consoleMode === 'wide');
      const toggle = document.getElementById('modeToggle');
      toggle.textContent = consoleMode === 'wide' ? 'Minimize to Sidebar' : 'Expand Workspace';
      toggle.hidden = false;
    }

    function loadInitial() {
      google.script.run
        .withSuccessHandler(result => {
          const state = result && result.launchState || {};
          applyConsoleMode(state.mode);
          render(result && result.context, state.hasForm ? state.form : null);
        })
        .withFailureHandler(error => {
          applyConsoleMode('sidebar');
          showFailure(error);
          load();
        })
        .getReviewControllerInitialContext();
    }

    function load(selection, formOverride) {
      setBusy(true);
      setStatus('Loading communication console...');
      google.script.run
        .withSuccessHandler(context => render(context, formOverride || null))
        .withFailureHandler(showFailure)
        .getReviewControllerContext(selection || '');
    }

    function render(context, formOverride) {
      setBusy(false);
      currentContext = context;
      const app = document.getElementById('app');
      if (!context || !context.ok) {
        app.hidden = true;
        setStatus(context && context.message ? context.message : 'Unable to load Communication Console.', 'error');
        return;
      }

      app.hidden = false;
      setStatus(context.message || 'Ready.', 'success');

      const communicationSelect = document.getElementById('communicationSelect');
      communicationSelect.textContent = '';
      (context.communications || []).forEach(optionData => {
        const option = document.createElement('option');
        option.value = optionData.value;
        option.textContent = optionData.label;
        communicationSelect.appendChild(option);
      });
      communicationSelect.value = context.selectedCommunication || 'new';
      communicationSelect.onchange = function() {
        load(communicationSelect.value);
      };

      document.getElementById('subjectInput').value = context.queue.subject || '';
      document.getElementById('ownerInput').value = context.queue.owner || '';
      document.getElementById('what').value = context.queue.what || '';
      document.getElementById('soWhat').value = context.queue.soWhat || '';
      document.getElementById('whatsNext').value = context.queue.whatsNext || '';

      const anchor = document.getElementById('anchor');
      if (context.flow.anchorUrl) {
        anchor.href = context.flow.anchorUrl;
        anchor.hidden = false;
      } else {
        anchor.hidden = true;
      }

      const actionSelect = document.getElementById('flowAction');
      actionSelect.textContent = '';
      actionDefaults = {};
      context.actions.forEach(action => {
        const option = document.createElement('option');
        option.value = action.value;
        option.textContent = action.label;
        option.dataset.eventKey = action.eventKey || '';
        actionSelect.appendChild(option);
        actionDefaults[action.value] = action.defaults || {};
      });
      actionSelect.onchange = applyActionDefaults;
      ['subjectInput', 'ownerInput', 'what', 'soWhat', 'whatsNext'].forEach(id => {
        const field = document.getElementById(id);
        field.oninput = refreshPreviewForChosenAction;
        field.onchange = refreshPreviewForChosenAction;
      });
      if (formOverride) {
        applyFormOverride(formOverride);
      } else if ((context.mode === 'new' || context.mode === 'flow') && actionSelect.options.length) {
        applyActionDefaults();
      }
      refreshPreviewForChosenAction();
    }

    function applyFormOverride(form) {
      if (!form) return;

      const actionSelect = document.getElementById('flowAction');
      if (form.flowAction && Array.from(actionSelect.options).some(option => option.value === form.flowAction)) {
        actionSelect.value = form.flowAction;
      }

      document.getElementById('subjectInput').value = form.subject || '';
      document.getElementById('ownerInput').value = form.owner || '';
      document.getElementById('what').value = form.what || '';
      document.getElementById('soWhat').value = form.soWhat || '';
      document.getElementById('whatsNext').value = form.whatsNext || '';
    }

    function applyActionDefaults() {
      const action = document.getElementById('flowAction').value;
      const defaults = actionDefaults[action];
      if (!defaults) return;

      document.getElementById('what').value = defaults.what || '';
      document.getElementById('soWhat').value = defaults.soWhat || '';
      document.getElementById('whatsNext').value = defaults.whatsNext || '';
      refreshPreviewForChosenAction();
      setStatus(action === 'selected' ? 'Selected draft restored.' : 'Default text loaded for chosen action.', 'success');
    }

    function refreshPreviewForChosenAction() {
      if (!currentContext || !currentContext.ok) return;
      scheduleMessagePreview();
    }

    function scheduleMessagePreview() {
      window.clearTimeout(previewTimer);
      previewTimer = window.setTimeout(loadMessagePreview, 250);
    }

    function loadMessagePreview() {
      if (!currentContext || !currentContext.ok) return;
      const requestId = ++previewRequestId;
      document.getElementById('messagePreview').textContent = 'Rendering preview...';
      google.script.run
        .withSuccessHandler(result => {
          if (requestId === previewRequestId) renderMessagePreview(result);
        })
        .withFailureHandler(error => {
          if (requestId !== previewRequestId) return;
          document.getElementById('previewMeta').textContent = '';
          document.getElementById('messagePreview').textContent = error && error.message ? error.message : String(error);
        })
        .previewReviewControllerMessage(collectForm());
    }

    function renderMessagePreview(result) {
      const meta = document.getElementById('previewMeta');
      const body = document.getElementById('messagePreview');
      if (!result || !result.ok) {
        meta.textContent = '';
        body.textContent = result && result.message ? result.message : 'Preview unavailable.';
        return;
      }

      meta.textContent = [result.previewMode, result.eventName, result.templateKey].filter(Boolean).join(' | ');
      body.textContent = result.previewText || result.anchorText || result.replyText || 'Preview unavailable.';
    }

    function collectForm() {
      return {
        selection: document.getElementById('communicationSelect').value,
        queueId: currentContext && currentContext.queue ? currentContext.queue.queueId : '',
        flowId: currentContext && currentContext.queue ? currentContext.queue.flowId : '',
        flowAction: document.getElementById('flowAction').value,
        eventKey: selectedActionEventKey(),
        subject: document.getElementById('subjectInput').value,
        what: document.getElementById('what').value,
        soWhat: document.getElementById('soWhat').value,
        whatsNext: document.getElementById('whatsNext').value,
        owner: document.getElementById('ownerInput').value,
        priority: currentContext && currentContext.queue ? currentContext.queue.priority : ''
      };
    }

    function selectedActionEventKey() {
      const actionSelect = document.getElementById('flowAction');
      const selected = actionSelect.options[actionSelect.selectedIndex];
      return selected ? selected.dataset.eventKey || '' : '';
    }

    function queueDraft() {
      const form = collectForm();
      runAction('Queueing draft...', 'queueReviewControllerDraft', form, render);
    }

    function approveDraft() {
      runAction('Approving and sending...', 'approveReviewControllerSelection', collectForm(), afterTerminalAction);
    }

    function toggleWorkspaceMode() {
      const targetMode = consoleMode === 'wide' ? 'sidebar' : 'wide';
      const form = currentContext && currentContext.ok ? collectForm() : {};
      setBusy(true);
      setStatus(targetMode === 'wide' ? 'Opening wide workspace...' : 'Returning to sidebar...');

      const runner = google.script.run
        .withSuccessHandler(() => google.script.host.close())
        .withFailureHandler(showFailure);

      if (targetMode === 'wide') {
        runner.expandReviewControllerWorkspace(form);
      } else {
        runner.minimizeReviewControllerWorkspace(form);
      }
    }

    function runAction(message, fnName, form, handler) {
      setBusy(true);
      setStatus(message);
      const runner = google.script.run
        .withSuccessHandler(handler)
        .withFailureHandler(showFailure);

      if (fnName === 'saveReviewControllerDraft') {
        runner.saveReviewControllerDraft(form);
      } else if (fnName === 'queueReviewControllerDraft') {
        runner.queueReviewControllerDraft(form);
      } else if (fnName === 'approveReviewControllerDraft') {
        runner.approveReviewControllerDraft(form);
      } else if (fnName === 'approveReviewControllerSelection') {
        runner.approveReviewControllerSelection(form);
      } else if (fnName === 'createReviewControllerFlowActionDraft') {
        runner.createReviewControllerFlowActionDraft(form);
      }
    }

    function afterTerminalAction(result) {
      setBusy(false);
      setStatus(result && result.message ? result.message : 'Done.', 'success');
      window.setTimeout(load, 700);
    }

    function showFailure(error) {
      setBusy(false);
      setStatus(error && error.message ? error.message : String(error), 'error');
    }

    loadInitial();
  </script>
</body>
</html>

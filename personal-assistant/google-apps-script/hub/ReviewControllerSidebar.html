<!doctype html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #202124;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #fff;
    }

    body.wide {
      padding: 18px 20px;
    }

    label {
      display: block;
      margin: 12px 0 4px;
      color: #3c4043;
      font-weight: 700;
    }

    select,
    input,
    .html-editor {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 8px;
      font: inherit;
      color: #202124;
      background: #fff;
    }

    .html-editor {
      line-height: 1.4;
      min-height: 190px;
      outline: none;
      overflow: auto;
      resize: vertical;
    }

    .editor-toolbar {
      align-items: center;
      background: #f8fafd;
      border: 1px solid #dadce0;
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 5px;
    }

    .editor-toolbar button {
      background: transparent;
      border-radius: 4px;
      color: #3c4043;
      min-width: 30px;
      padding: 5px 7px;
    }

    .editor-toolbar button:hover,
    .editor-toolbar button:focus {
      background: #e8f0fe;
      outline: none;
    }

    .editor-toolbar .separator {
      background: #dadce0;
      height: 22px;
      margin: 0 2px;
      width: 1px;
    }

    .html-editor.with-toolbar {
      border-radius: 0 0 6px 6px;
    }

    .title-editor {
      min-height: 34px;
      resize: none;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: .62;
    }

    .mode-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
    }

    .mode-toggle {
      font-size: 12px;
      padding: 7px 9px;
    }

    .primary {
      background: #1a73e8;
      color: #fff;
    }

    .secondary {
      background: #e8f0fe;
      color: #174ea6;
    }

    .plain {
      background: #f1f3f4;
      color: #202124;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    body.wide .html-editor {
      min-height: 360px;
    }

    body.wide .title-editor {
      min-height: 34px;
    }

    .meta {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
      margin-top: 12px;
    }

    .meta div {
      margin: 0 0 6px;
    }

    .meta div:last-child {
      margin-bottom: 0;
    }

    .key {
      color: #5f6368;
      font-weight: 700;
    }

    .editor-note {
      color: #5f6368;
      font-size: 12px;
      line-height: 1.35;
      margin-top: 4px;
    }

    .link-row {
      margin-top: 10px;
    }

    .status {
      margin: 10px 0;
      min-height: 18px;
      color: #5f6368;
    }

    .error {
      color: #a50e0e;
      font-weight: 700;
    }

    .success {
      color: #137333;
      font-weight: 700;
    }

    a {
      color: #1a73e8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="mode-bar">
    <button class="plain mode-toggle" id="modeToggle" onclick="toggleWorkspaceMode()" hidden>Expand Workspace</button>
  </div>
  <div id="status" class="status">Loading communication console...</div>
  <div id="app" hidden>
    <label for="communicationSelect">Communication</label>
    <select id="communicationSelect"></select>

    <label for="flowAction">Action</label>
    <select id="flowAction"></select>

    <label for="messageTitle">Title</label>
    <div class="editor-toolbar" aria-label="Title formatting tools">
      <button type="button" title="Bold" onmousedown="formatEditor(event, 'messageTitle', 'bold')"><strong>B</strong></button>
      <button type="button" title="Italic" onmousedown="formatEditor(event, 'messageTitle', 'italic')"><em>I</em></button>
      <span class="separator"></span>
      <button type="button" title="Add link" onmousedown="addLink(event, 'messageTitle')">Link</button>
      <button type="button" title="Remove link" onmousedown="formatEditor(event, 'messageTitle', 'unlink')">Unlink</button>
    </div>
    <div id="messageTitle" class="html-editor title-editor with-toolbar" contenteditable="true"></div>

    <label for="messageBody">Body</label>
    <div class="editor-toolbar" aria-label="Body formatting tools">
      <button type="button" title="Bold" onmousedown="formatEditor(event, 'messageBody', 'bold')"><strong>B</strong></button>
      <button type="button" title="Italic" onmousedown="formatEditor(event, 'messageBody', 'italic')"><em>I</em></button>
      <span class="separator"></span>
      <button type="button" title="Bullet list" onmousedown="formatEditor(event, 'messageBody', 'insertUnorderedList')">&bull;</button>
      <button type="button" title="Numbered list" onmousedown="formatEditor(event, 'messageBody', 'insertOrderedList')">1.</button>
      <button type="button" title="Decrease list level" onmousedown="formatEditor(event, 'messageBody', 'outdent')">&larr;</button>
      <button type="button" title="Increase list level" onmousedown="formatEditor(event, 'messageBody', 'indent')">&rarr;</button>
      <span class="separator"></span>
      <button type="button" title="Add link" onmousedown="addLink(event, 'messageBody')">Link</button>
      <button type="button" title="Remove link" onmousedown="formatEditor(event, 'messageBody', 'unlink')">Unlink</button>
    </div>
    <div id="messageBody" class="html-editor with-toolbar" contenteditable="true"></div>
    <div class="editor-note">Use the toolbar for formatting. Tab and Shift+Tab adjust list levels.</div>

    <div class="link-row">
      <a id="anchor" href="#" target="_blank" hidden>Open Slack anchor</a>
    </div>

    <div class="actions">
      <button class="plain" id="syncBtn" onclick="syncDashboardNow()">Sync Dashboard Now</button>
      <button class="secondary" id="queueBtn" onclick="queueDraft()">Queue up Draft</button>
      <button class="primary" id="approveBtn" onclick="approveDraft()">Approve & Send</button>
    </div>
  </div>

  <script>
    let currentContext = null;
    let actionDefaults = {};
    let consoleMode = 'sidebar';
    let savedEditorRanges = {};

    function setStatus(message, mode) {
      const el = document.getElementById('status');
      el.textContent = message || '';
      el.className = 'status ' + (mode || '');
    }

    function setBusy(isBusy) {
      ['communicationSelect', 'flowAction', 'messageTitle', 'messageBody', 'syncBtn', 'queueBtn', 'approveBtn', 'modeToggle'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        if (id === 'messageTitle' || id === 'messageBody') {
          el.contentEditable = isBusy ? 'false' : 'true';
        } else {
          el.disabled = isBusy;
        }
      });
      Array.from(document.querySelectorAll('.editor-toolbar button')).forEach(button => {
        button.disabled = isBusy;
      });
    }

    function applyConsoleMode(mode) {
      consoleMode = mode === 'wide' ? 'wide' : 'sidebar';
      document.body.classList.toggle('wide', consoleMode === 'wide');
      const toggle = document.getElementById('modeToggle');
      toggle.textContent = consoleMode === 'wide' ? 'Minimize to Sidebar' : 'Expand Workspace';
      toggle.hidden = false;
    }

    function loadInitial() {
      google.script.run
        .withSuccessHandler(result => {
          const state = result && result.launchState || {};
          applyConsoleMode(state.mode);
          render(result && result.context, state.hasForm ? state.form : null);
        })
        .withFailureHandler(error => {
          applyConsoleMode('sidebar');
          showFailure(error);
          load();
        })
        .getReviewControllerInitialContext();
    }

    function load(selection, formOverride) {
      setBusy(true);
      setStatus('Loading communication console...');
      google.script.run
        .withSuccessHandler(context => render(context, formOverride || null))
        .withFailureHandler(showFailure)
        .getReviewControllerContext(selection || '');
    }

    function render(context, formOverride) {
      setBusy(false);
      currentContext = context;
      const app = document.getElementById('app');
      if (!context || !context.ok) {
        app.hidden = true;
        setStatus(context && context.message ? context.message : 'Unable to load Communication Console.', 'error');
        return;
      }

      app.hidden = false;
      setStatus(context.message || 'Ready.', 'success');

      const communicationSelect = document.getElementById('communicationSelect');
      communicationSelect.textContent = '';
      (context.communications || []).forEach(optionData => {
        const option = document.createElement('option');
        option.value = optionData.value;
        option.textContent = optionData.label;
        communicationSelect.appendChild(option);
      });
      communicationSelect.value = context.selectedCommunication || 'new';
      communicationSelect.onchange = function() {
        load(communicationSelect.value);
      };

      document.getElementById('messageTitle').innerHTML = context.queue.messageTitleHtml || escapeHtml(context.queue.messageTitle || context.queue.subject || '');
      document.getElementById('messageBody').innerHTML = context.queue.messageBodyHtml || '';

      const anchor = document.getElementById('anchor');
      if (context.flow.anchorUrl) {
        anchor.href = context.flow.anchorUrl;
        anchor.hidden = false;
      } else {
        anchor.hidden = true;
      }

      const actionSelect = document.getElementById('flowAction');
      actionSelect.textContent = '';
      actionDefaults = {};
      context.actions.forEach(action => {
        const option = document.createElement('option');
        option.value = action.value;
        option.textContent = action.label;
        option.dataset.eventKey = action.eventKey || '';
        actionSelect.appendChild(option);
        actionDefaults[action.value] = action.defaults || {};
      });
      actionSelect.onchange = applyActionDefaults;
      if (formOverride) {
        applyFormOverride(formOverride);
      } else if ((context.mode === 'new' || context.mode === 'flow') && actionSelect.options.length) {
        applyActionDefaults();
      }
      bindEditorEvents();
    }

    function applyFormOverride(form) {
      if (!form) return;

      const actionSelect = document.getElementById('flowAction');
      if (form.flowAction && Array.from(actionSelect.options).some(option => option.value === form.flowAction)) {
        actionSelect.value = form.flowAction;
      }

      document.getElementById('messageTitle').innerHTML = form.messageTitleHtml || escapeHtml(form.messageTitle || '');
      document.getElementById('messageBody').innerHTML = form.messageBodyHtml || '';
    }

    function applyActionDefaults() {
      const action = document.getElementById('flowAction').value;
      const defaults = actionDefaults[action];
      if (!defaults) return;

      document.getElementById('messageTitle').innerHTML = defaults.messageTitleHtml || escapeHtml(defaults.messageTitle || '');
      document.getElementById('messageBody').innerHTML = defaults.messageBodyHtml || '';
      setStatus(action === 'selected' ? 'Selected draft restored.' : 'Default text loaded for chosen action.', 'success');
    }

    function collectForm() {
      const titleEditor = document.getElementById('messageTitle');
      const title = titleEditor.textContent || '';
      const titleHtml = titleEditor.innerHTML;
      const bodyHtml = document.getElementById('messageBody').innerHTML;
      return {
        selection: document.getElementById('communicationSelect').value,
        queueId: currentContext && currentContext.queue ? currentContext.queue.queueId : '',
        flowId: currentContext && currentContext.queue ? currentContext.queue.flowId : '',
        flowAction: document.getElementById('flowAction').value,
        eventKey: selectedActionEventKey(),
        subject: currentContext && currentContext.queue ? currentContext.queue.subject : title,
        messageTitle: title,
        messageTitleHtml: titleHtml,
        messageBodyHtml: bodyHtml,
        owner: currentContext && currentContext.queue ? currentContext.queue.owner : '',
        priority: currentContext && currentContext.queue ? currentContext.queue.priority : ''
      };
    }

    function selectedActionEventKey() {
      const actionSelect = document.getElementById('flowAction');
      const selected = actionSelect.options[actionSelect.selectedIndex];
      return selected ? selected.dataset.eventKey || '' : '';
    }

    function queueDraft() {
      const form = collectForm();
      const validation = validateForm(form);
      if (!validation.ok) return showValidationFailure(validation, form);
      runAction('Queueing draft...', 'queueReviewControllerDraft', form, render);
    }

    function approveDraft() {
      const form = collectForm();
      const validation = validateForm(form);
      if (!validation.ok) return showValidationFailure(validation, form);
      runAction('Approving and sending...', 'approveReviewControllerSelection', form, afterTerminalAction);
    }

    function syncDashboardNow() {
      const form = currentContext && currentContext.ok ? collectForm() : {};
      setBusy(true);
      setStatus('Syncing dashboard...');
      google.script.run
        .withSuccessHandler(result => afterDashboardSync(result, form))
        .withFailureHandler(showFailure)
        .syncDashboardFromCommunicationConsole(form);
    }

    function validateForm(form) {
      const missing = [];
      if (!form.eventKey) missing.push('action');
      if (!htmlHasVisibleText(form.messageTitleHtml)) missing.push('title');
      if (!htmlHasVisibleText(form.messageBodyHtml)) missing.push('body');
      return {
        ok: missing.length === 0,
        missing: missing
      };
    }

    function htmlHasVisibleText(html) {
      const scratch = document.createElement('div');
      scratch.innerHTML = html || '';
      return Boolean(String(scratch.textContent || '').trim());
    }

    function bindEditorEvents() {
      ['messageTitle', 'messageBody'].forEach(id => {
        const editor = document.getElementById(id);
        editor.onkeyup = () => saveEditorSelection(id);
        editor.onmouseup = () => saveEditorSelection(id);
        editor.onfocus = () => saveEditorSelection(id);
        editor.onkeydown = event => handleEditorKeydown(event, id);
      });
    }

    function saveEditorSelection(editorId) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return;
      const editor = document.getElementById(editorId);
      const range = selection.getRangeAt(0);
      if (editor.contains(range.commonAncestorContainer)) {
        savedEditorRanges[editorId] = range.cloneRange();
      }
    }

    function restoreEditorSelection(editorId) {
      const editor = document.getElementById(editorId);
      editor.focus();
      const savedEditorRange = savedEditorRanges[editorId];
      if (!savedEditorRange) return;
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(savedEditorRange);
    }

    function formatEditor(event, editorId, command) {
      event.preventDefault();
      restoreEditorSelection(editorId);
      document.execCommand(command, false, null);
      saveEditorSelection(editorId);
      document.getElementById(editorId).focus();
    }

    function addLink(event, editorId) {
      event.preventDefault();
      restoreEditorSelection(editorId);
      const url = window.prompt('Link URL');
      if (!url) return;
      document.execCommand('createLink', false, url);
      saveEditorSelection(editorId);
      document.getElementById(editorId).focus();
    }

    function handleEditorKeydown(event, editorId) {
      saveEditorSelection(editorId);
      if (editorId === 'messageTitle' && event.key === 'Enter') {
        event.preventDefault();
        return;
      }
      if (editorId !== 'messageBody') return;
      if (event.key !== 'Tab') return;
      event.preventDefault();
      document.execCommand(event.shiftKey ? 'outdent' : 'indent', false, null);
      saveEditorSelection(editorId);
    }

    function escapeHtml(value) {
      const scratch = document.createElement('div');
      scratch.textContent = value || '';
      return scratch.innerHTML;
    }

    function showValidationFailure(validation, form) {
      const message = 'Add ' + validation.missing.join(', ') + ' before continuing.';
      setStatus(message, 'error');
      logClientEvent('validation_failure', form, { missing: validation.missing.join(', ') });
    }

    function toggleWorkspaceMode() {
      const targetMode = consoleMode === 'wide' ? 'sidebar' : 'wide';
      const form = currentContext && currentContext.ok ? collectForm() : {};
      setBusy(true);
      setStatus(targetMode === 'wide' ? 'Opening wide workspace...' : 'Returning to sidebar...');

      const runner = google.script.run
        .withSuccessHandler(() => google.script.host.close())
        .withFailureHandler(showFailure);

      if (targetMode === 'wide') {
        runner.expandReviewControllerWorkspace(form);
      } else {
        runner.minimizeReviewControllerWorkspace(form);
      }
    }

    function runAction(message, fnName, form, handler) {
      setBusy(true);
      setStatus(message);
      const runner = google.script.run
        .withSuccessHandler(handler)
        .withFailureHandler(showFailure);

      if (fnName === 'saveReviewControllerDraft') {
        runner.saveReviewControllerDraft(form);
      } else if (fnName === 'queueReviewControllerDraft') {
        runner.queueReviewControllerDraft(form);
      } else if (fnName === 'approveReviewControllerDraft') {
        runner.approveReviewControllerDraft(form);
      } else if (fnName === 'approveReviewControllerSelection') {
        runner.approveReviewControllerSelection(form);
      } else if (fnName === 'createReviewControllerFlowActionDraft') {
        runner.createReviewControllerFlowActionDraft(form);
      }
    }

    function afterTerminalAction(result) {
      setBusy(false);
      setStatus(result && result.message ? result.message : 'Done.', 'success');
      window.setTimeout(load, 700);
    }

    function afterDashboardSync(result, form) {
      setBusy(false);
      setStatus(result && result.message ? result.message : 'Dashboard sync complete.', 'success');
      window.setTimeout(() => load(form && form.selection || '', form || null), 700);
    }

    function showFailure(error) {
      setBusy(false);
      setStatus(error && error.message ? error.message : String(error), 'error');
      logClientEvent('ui_error', currentContext && currentContext.ok ? collectForm() : {}, {
        error: error && error.message ? error.message : String(error)
      });
    }

    function logClientEvent(eventType, form, details) {
      try {
        google.script.run.logReviewControllerClientEvent(eventType, form || {}, details || {});
      } catch (error) {
        // Logging is best-effort and must never block PM workflow.
      }
    }

    loadInitial();
  </script>
</body>
</html>
